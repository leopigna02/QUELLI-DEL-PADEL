<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quelli del padel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@800;900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sofia+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&amp;display=swap">
<meta name="theme-color" content="#1A56C6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Padel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style id="app-style">/*QDP-CSS*/
:root {
  /* Campo di giorno. Layout da iPhone: testata disegnata come un campo visto dall'alto
     che arriva fin sotto la barra di stato, una colonna che scorre, sezioni in una barra
     traslucida fissa in basso sopra l'indicatore home. */
  --bg: #ECF0F6;
  --surface: #FFFFFF;
  --ink: #0C1A35;
  --muted: #56667F;
  --line: #D4DCE8;
  --court: #1A56C6;
  --ball: #DDEE3A;
  --on-ball: #1A2408;
  --lead: #F1F7BE;
  --link: #1A56C6;
  --field: #F3F6FA;
  --bar: rgba(255, 255, 255, .86);
  --win: #15834A;
  --loss: #C93B3B;
  --draw: #6F7C92;
  --on-sem: #FFFFFF;
  --shade: rgba(8, 16, 34, .55);
  --font-display: "Sofia Sans Extra Condensed", "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", sans-serif-condensed, sans-serif;
  --font-body: "Sofia Sans", "Avenir Next", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    /* Campo in notturna */
    --bg: #081020;
    --surface: #101B31;
    --ink: #E9EFFA;
    --muted: #8E9DB8;
    --line: #22304D;
    --court: #1F5DD6;
    --ball: #E1F14A;
    --on-ball: #1A2408;
    --lead: #242E13;
    --link: #8DB3FF;
    --field: #0A1426;
    --bar: rgba(16, 27, 49, .86);
    --win: #3CC27A;
    --loss: #F07070;
    --draw: #8E9DB8;
    --on-sem: #06101F;
    --shade: rgba(2, 6, 14, .72);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #081020;
  --surface: #101B31;
  --ink: #E9EFFA;
  --muted: #8E9DB8;
  --line: #22304D;
  --court: #1F5DD6;
  --ball: #E1F14A;
  --on-ball: #1A2408;
  --lead: #242E13;
  --link: #8DB3FF;
  --field: #0A1426;
  --bar: rgba(16, 27, 49, .86);
  --win: #3CC27A;
  --loss: #F07070;
  --draw: #8E9DB8;
  --on-sem: #06101F;
  --shade: rgba(2, 6, 14, .72);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.45 var(--font-body);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
body.has-sheet { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button, .btn, .tab, label.btn { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
p { margin: 0; }
img { max-width: 100%; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
.mast :focus-visible { outline-color: #fff; }

.app { min-height: 100%; display: flex; flex-direction: column; }

/* ── Testata: il campo ── */
.mast { background: var(--court); color: #fff; }
.mast-in {
  max-width: 560px; margin: 0 auto;
  padding: calc(10px + env(safe-area-inset-top, 0px)) var(--gutter-r) 16px var(--gutter-l);
  display: flex; flex-direction: column; gap: 10px;
}
.mast-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 32px; }
.mast-kicker { font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; opacity: .9; overflow-wrap: anywhere; }
.mast-court {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  border: 2px solid rgba(255, 255, 255, .75);
  border-radius: 3px;
}
.mast-left { display: flex; align-items: flex-end; padding: 18px 14px 14px; min-width: 0; }
.mast-left.is-me { align-items: center; gap: 12px; padding: 14px; flex-wrap: wrap; }
.mast-title {
  margin: 0;
  font: 900 48px/.86 var(--font-display);
  letter-spacing: .005em;
  text-transform: uppercase;
  text-wrap: balance;
  overflow-wrap: anywhere;
}
.fonts-ok .mast-title { font-size: 58px; }
.is-me .mast-title { font-size: 40px; }
.fonts-ok .is-me .mast-title { font-size: 48px; }
.mast-sub { margin-top: 6px; font-size: 13px; font-weight: 600; opacity: .92; }
.ball { display: inline-block; width: .2em; height: .2em; margin-left: .08em; border-radius: 50%; background: var(--ball); }
.mast-right { display: grid; grid-template-rows: 1fr 1fr; min-width: 104px; max-width: 46vw; border-left: 3px dashed rgba(255, 255, 255, .9); }
.mast-box { display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 9px 14px 10px; min-width: 0; }
.mast-box + .mast-box { border-top: 2px solid rgba(255, 255, 255, .75); }
.mast-box .l { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; opacity: .9; }
.mast-box .n { font: 800 36px/.9 var(--font-display); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.mast-box .n small { font-size: 19px; font-weight: 600; opacity: .8; margin-left: 1px; }
.mast-box .n.is-name { font-size: 27px; line-height: .95; text-transform: uppercase; }
.mast-slim { flex-direction: row; align-items: center; justify-content: space-between; padding-bottom: 12px; }
.mast-name { font: 900 30px/.9 var(--font-display); text-transform: uppercase; letter-spacing: .01em; overflow-wrap: anywhere; }

.sync {
  display: inline-flex; align-items: center; gap: 7px; flex: none;
  min-height: 32px; padding: 0 12px;
  border: 1px solid rgba(255, 255, 255, .5); border-radius: 999px;
  background: transparent; color: #fff;
  font: 600 12px/1 var(--font-body);
  white-space: nowrap;
}
button.sync { background: rgba(255, 255, 255, .16); }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ball); flex: none; }
.sync.is-ro i { background: transparent; border: 2px solid #fff; }
.sync.is-err i { background: #FFB0B0; }
.sync.is-busy i, .sync.is-dirty i { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }

/* ── Avatar ── */
.av {
  display: inline-grid; place-items: center; flex: none;
  width: 36px; height: 36px; border-radius: 50%; overflow: hidden;
  background: var(--field); color: var(--muted);
  border: 2px solid var(--line);
  font: 800 20px/1 var(--font-display); text-transform: uppercase;
}
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av-xs { width: 26px; height: 26px; border-width: 1.5px; font-size: 15px; }
.av-m { width: 52px; height: 52px; font-size: 28px; }
.av-l { width: 84px; height: 84px; border-width: 3px; font-size: 44px; }
.av-xl { width: 92px; height: 92px; border-width: 3px; font-size: 48px; }
.av.is-ring { border-color: var(--ball); }
.mast .av { border-color: var(--ball); background: rgba(255, 255, 255, .16); color: #fff; }

/* ── Colonna ── */
.view {
  flex: 1;
  width: 100%; max-width: 560px; margin: 0 auto;
  padding: 22px var(--gutter-r) 32px var(--gutter-l);
  display: flex; flex-direction: column; gap: 30px;
}
.block { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 12px; flex-wrap: wrap; }
h2 { margin: 0; font: 800 32px/1 var(--font-display); letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; }
h3 { margin: 0; font: 800 23px/1 var(--font-display); letter-spacing: .015em; text-transform: uppercase; text-wrap: balance; }
.hint { color: var(--muted); font-size: 13px; }
.note { color: var(--muted); font-size: 14px; max-width: 65ch; }
.err { color: var(--loss); font-size: 14px; font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.pad { padding: 14px; }
a { color: var(--link); }

/* ── Tabelle ── */
.rank { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.rank th, .rank td { padding: 10px 5px; text-align: right; font-size: 15px; font-weight: 500; }
.rank thead th { padding: 11px 5px 8px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.rank thead abbr { text-decoration: none; }
.rank tbody th, .rank tbody td { border-top: 1px solid var(--line); }
.rank .c-pos { width: 38px; padding-left: 10px; text-align: center; }
.rank .c-who { text-align: left; }
.rank .c-pt { width: 52px; padding-right: 14px; font: 800 26px/1 var(--font-display); }
.rank thead .c-pt { font: 600 11px/1.45 var(--font-body); }
.pos { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; font: 800 20px/1 var(--font-display); }
.is-lead th, .is-lead td { background: var(--lead); }
.is-lead .pos { background: var(--ball); color: var(--on-ball); }
.rank tbody tr:last-child th:first-child, .rank tbody tr:last-child td:first-child { border-bottom-left-radius: 15px; }
.rank tbody tr:last-child td:last-child { border-bottom-right-radius: 15px; }
.who { display: flex; align-items: center; gap: 9px; width: 100%; padding: 0; border: 0; background: none; color: var(--ink); text-align: left; min-width: 0; }
.who-txt { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.who-name { font-size: 17px; font-weight: 700; line-height: 1.1; overflow-wrap: anywhere; }
.me-tag { display: inline-block; margin-left: 6px; padding: 2px 6px; border-radius: 999px; background: var(--court); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; vertical-align: 2px; }
.form { display: inline-flex; gap: 3px; }
.f { width: 13px; height: 5px; border-radius: 2px; background: var(--draw); }
.f-V { background: var(--win); }
.f-P { background: var(--loss); }
.rank .tag { display: block; margin-top: 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
.rank.mini .c-who { padding-left: 14px; font-weight: 700; overflow-wrap: anywhere; }
.rank.mini td:last-child, .rank.mini thead th:last-child { padding-right: 14px; }
.rank.mini .strong { font: 800 22px/1 var(--font-display); }

/* ── Bottoni e campi ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px;
  border: 1px solid var(--line); border-radius: 14px;
  background: var(--surface); color: var(--ink);
  font: 600 16px/1.1 var(--font-body); text-decoration: none; text-align: center;
  transition: transform .08s, opacity .08s;
}
.btn:active, .chip:active, .fig:active, .g-row:active, .match:active, .who:active { transform: scale(.98); opacity: .85; }
.btn.primary { background: var(--court); border-color: var(--court); color: #fff; }
.btn.danger { color: var(--loss); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--link); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions .btn { flex: 1 1 auto; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
label, .label { font-size: 13px; font-weight: 600; color: var(--muted); }
input[type="text"], input[type="date"], select, textarea {
  width: 100%; min-height: 48px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--field); color: var(--ink);
  font: 500 17px/1.2 var(--font-body);
  -webkit-appearance: none; appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 21px, calc(100% - 13px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
textarea { min-height: 190px; padding: 12px; line-height: 1.4; resize: vertical; }
input:disabled, select:disabled { opacity: .7; }
input[type="date"] { display: block; min-width: 0; }
input[type="range"] { width: 100%; height: 40px; margin: 0; accent-color: var(--court); touch-action: pan-y; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stepper {
  display: inline-grid; grid-template-columns: 46px 62px 46px; align-items: center;
  border: 1px solid var(--line); border-radius: 12px; background: var(--field); overflow: hidden;
}
.stepper button { height: 46px; border: 0; background: transparent; font: 700 24px/1 var(--font-body); }
.stepper button:disabled { opacity: .35; }
.stepper output, .stepper input[type="text"] {
  width: 100%; min-width: 0; min-height: 46px; padding: 0; border: 0; border-radius: 0; background: transparent;
  text-align: center; font: 800 28px/1 var(--font-display); font-variant-numeric: tabular-nums;
}
.stepper output { display: grid; place-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  min-height: 44px; padding: 0 15px;
  border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--ink);
  font: 600 15px/1 var(--font-body);
}
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip small { display: block; margin-top: 4px; font-size: 12px; font-weight: 500; line-height: 1.3; opacity: .8; }
.chip.tall { min-height: 58px; padding: 9px 14px; border-radius: 12px; text-align: left; line-height: 1.2; flex: 1 1 150px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 13px; background: var(--field); }
.seg button { min-height: 40px; padding: 2px 4px; overflow-wrap: anywhere; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: 600 14px/1.1 var(--font-body); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(8, 16, 34, .22); }

/* ── Ingresso ── */
.gate-form { display: flex; flex-direction: column; gap: 12px; }
.gate-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.gate-peek { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.gate-peek b { font-weight: 700; }

/* ── Campo della partita ── */
.match { display: block; width: 100%; padding: 0; border: 0; background: none; color: inherit; text-align: left; }
.match-meta { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; padding: 0 2px 7px; font-size: 13px; color: var(--muted); }
.match-meta b { color: var(--ink); font-weight: 700; }
.match-cta { font-weight: 700; color: var(--link); }
.match-cta.is-off { color: var(--muted); font-weight: 600; }
.court { display: block; padding: 5px; border-radius: 8px; background: var(--court); color: #fff; }
.court-in {
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  min-height: 88px;
  border: 2px solid rgba(255, 255, 255, .8); border-radius: 2px;
}
.side { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 12px; min-width: 0; }
.side-b { flex-direction: row-reverse; text-align: right; }
.names { display: flex; flex-direction: column; gap: 1px; min-width: 0; font-size: 16px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.names .is-self { text-decoration: underline; text-decoration-color: var(--ball); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.score { flex: none; min-width: 30px; text-align: center; font: 900 50px/.85 var(--font-display); font-variant-numeric: tabular-nums; }
.net { border-left: 3px dashed rgba(255, 255, 255, .9); margin: 0; }
.side.is-win .score { color: var(--ball); }
.side.is-win .names { font-weight: 700; }
.side.is-lose .names { opacity: .78; }
.match.is-empty .score { opacity: .5; }
.match-mvp { display: flex; align-items: center; gap: 8px; padding: 9px 2px 0; font-size: 13px; color: var(--muted); }
.match-mvp b { color: var(--ink); font-weight: 700; }

/* ── MVP ── */
.star { display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--ball); color: var(--on-ball); font-size: 13px; line-height: 1; }
.star.is-off { background: var(--field); color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.mvp-line { display: flex; align-items: center; gap: 8px; padding-top: 14px; margin-top: 14px; border-top: 1px solid var(--line); font-size: 14px; font-weight: 600; }
.mvp-who { display: flex; align-items: center; gap: 8px; min-width: 0; }
.mvp-now { font-size: 15px; color: var(--muted); }
.mvp-now b { color: var(--ink); font-weight: 700; }
.log .btn { min-height: 44px; padding: 0 16px; font-size: 15px; }

/* ── Calendario: elenco delle giornate ── */
.g-list { list-style: none; margin: 0; padding: 0; }
.g-list li + li { border-top: 1px solid var(--line); }
.g-row { display: block; width: 100%; padding: 11px 12px 10px 8px; border: 0; background: none; color: inherit; text-align: left; }
.g-grid { display: grid; grid-template-columns: 34px minmax(0, 1fr) 58px minmax(0, 1fr); align-items: center; gap: 4px 8px; }
.g-num { grid-row: 1 / span 2; align-self: center; text-align: center; font: 800 25px/1 var(--font-display); color: var(--muted); font-variant-numeric: tabular-nums; }
.g-a, .g-b { display: flex; flex-direction: column; min-width: 0; font-size: 15px; font-weight: 500; line-height: 1.22; overflow-wrap: anywhere; }
.g-b { text-align: right; }
.g-a.is-win, .g-b.is-win { font-weight: 700; }
.g-a.is-lose, .g-b.is-lose { color: var(--muted); }
.g-score { text-align: center; font: 800 26px/1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.g-score.is-vs { font: 600 11px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.g-meta { grid-column: 2 / -1; display: flex; justify-content: space-between; gap: 2px 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.g-meta b { color: var(--link); font-weight: 700; }
.g-meta b.is-mvp { color: var(--ink); }
.g-row.is-next { background: var(--lead); }
.g-row.is-next .g-num { color: var(--ink); }
.g-row.is-mine { box-shadow: inset 4px 0 0 var(--court); }
.g-row .is-self { font-weight: 700; color: var(--ink); text-decoration: underline; text-decoration-color: var(--court); text-decoration-thickness: 2px; text-underline-offset: 3px; }
.g-list li:first-child .g-row { border-radius: 15px 15px 0 0; }
.g-list li:last-child .g-row { border-radius: 0 0 15px 15px; }

/* ── Area personale ── */
.kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 8px; margin: 0; }
.kpis div { display: flex; flex-direction: column-reverse; gap: 3px; }
.kpis dt { font-size: 12px; font-weight: 500; color: var(--muted); }
.kpis dd { margin: 0; font: 800 28px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.lastfive { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-top: 14px; margin-top: 14px; border-top: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--muted); }
.res-list { display: inline-flex; gap: 4px; }
.res { display: inline-grid; place-items: center; flex: none; width: 26px; height: 26px; border-radius: 6px; background: var(--draw); color: var(--on-sem); font-size: 13px; font-weight: 700; }
.res-V { background: var(--win); }
.res-P { background: var(--loss); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tagp { padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--field); font-size: 13px; font-weight: 600; }
.tagp.is-shot { background: var(--ball); border-color: var(--ball); color: var(--on-ball); }
.motto { font-size: 16px; font-style: italic; font-weight: 500; }
.skills { display: flex; flex-direction: column; gap: 9px; }
.skill { display: grid; grid-template-columns: 86px minmax(0, 1fr) 24px; align-items: center; gap: 10px; font-size: 14px; font-weight: 600; }
.skill .bar { height: 9px; border-radius: 5px; background: var(--field); border: 1px solid var(--line); overflow: hidden; }
.skill .bar i { display: block; height: 100%; background: var(--court); border-radius: 0 5px 5px 0; }
.skill b { text-align: right; font: 800 21px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.duo .card { display: flex; flex-direction: column; gap: 8px; padding: 12px; min-width: 0; }
.duo-who { display: flex; align-items: center; gap: 9px; min-width: 0; font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.log { list-style: none; margin: 0; padding: 0; }
.log li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 12px; }
.log li + li { border-top: 1px solid var(--line); }
.log-txt { font-size: 14px; line-height: 1.3; overflow-wrap: anywhere; }
.log-txt b { font-weight: 700; }
.log-txt small { display: block; color: var(--muted); font-size: 12px; }
.log-score { font: 800 24px/1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rest-note { display: flex; align-items: center; gap: 10px; padding: 12px 14px; font-size: 14px; }

/* ── Giocatori: le figurine ── */
.figs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fig {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 0 10px 14px; overflow: hidden;
  border: 1px solid var(--line); border-radius: 16px;
  background: var(--surface); color: inherit; text-align: center;
}
.fig-band { align-self: stretch; height: 58px; margin: 0 -10px; background: var(--court); border-bottom: 3px dashed rgba(255, 255, 255, .9); color: #fff; display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 12px; font: 800 24px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.fig-band .vote { color: var(--ball); }
.fig .av { margin-top: -40px; background: var(--surface); }
.fig-name { margin-top: 4px; font: 900 30px/.95 var(--font-display); text-transform: uppercase; overflow-wrap: anywhere; }
.fig-sub { font-size: 13px; font-weight: 600; color: var(--muted); }
.fig-shot { margin-top: 4px; padding: 4px 10px; border-radius: 999px; background: var(--field); border: 1px solid var(--line); font-size: 12px; font-weight: 600; }

/* ── Scheda: editor ── */
.stage-row { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.stage {
  position: relative; width: 208px; height: 208px; flex: none;
  border-radius: 50%; overflow: hidden;
  border: 4px solid var(--ball); background: var(--field);
  display: grid; place-items: center;
  font: 900 100px/1 var(--font-display); color: var(--muted); text-transform: uppercase;
}
.stage canvas { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.stage img { width: 100%; height: 100%; object-fit: cover; display: block; }
.file-in { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.sliders { display: grid; grid-template-columns: 84px minmax(0, 1fr); align-items: center; gap: 2px 12px; }
.sliders label { font-size: 14px; color: var(--ink); }
.rate { display: grid; grid-template-columns: 86px minmax(0, 1fr) 28px; align-items: center; gap: 10px; }
.rate label { font-size: 14px; color: var(--ink); }
.rate output { text-align: right; font: 800 24px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.savebar {
  position: sticky; bottom: 0; z-index: 4;
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px;
  margin: 0 calc(-1 * var(--gutter-r)) -32px calc(-1 * var(--gutter-l));
  padding: 12px var(--gutter-r) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  background: var(--bar); border-top: 1px solid var(--line);
  -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px);
}

/* ── Lega ── */
.rules { display: flex; flex-direction: column; }
.rule { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; }
.rule + .rule { border-top: 1px solid var(--line); }
.rule-name { font-weight: 600; }
.rule-name small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
.roster { display: flex; flex-direction: column; }
.roster-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 9px 12px; }
.roster-row + .roster-row { border-top: 1px solid var(--line); }
.roster-row .btn { min-height: 44px; padding: 0 14px; font-size: 14px; }
.roster-name { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.extras { list-style: none; margin: 0; padding: 0; }
.extras li { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; }
.extras li + li { border-top: 1px solid var(--line); }
.ex-pts { font: 800 26px/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--win); }
.ex-pts.is-neg { color: var(--loss); }
.ex-txt { font-size: 15px; overflow-wrap: anywhere; }
.ex-txt b { font-weight: 700; }
.x { width: 44px; height: 44px; flex: none; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 26px; line-height: 1; }
.extra-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: end; }
.extra-form .full { grid-column: 1 / -1; }

/* ── Barra delle sezioni ── */
.tabs {
  position: sticky; bottom: 0; z-index: 5;
  background: var(--bar); border-top: 1px solid var(--line);
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px);
}
.tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; padding: 8px 2px 6px; color: var(--muted); font-size: 11px; font-weight: 600; text-decoration: none; }
.tab svg { width: 24px; height: 24px; }
.tab .av { margin: -1px 0; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] .av { border-color: var(--court); }
.tab[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 26%; right: 26%; height: 3px; border-radius: 0 0 3px 3px; background: var(--court); }
[data-screen="gate"] .tabs, [data-screen="edit"] .tabs { display: none; }
[data-screen="gate"] .view { padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }

/* ── Pannello dal basso ── */
.sheet-wrap { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; background: var(--shade); }
.sheet {
  width: 100%; max-width: 560px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); overflow: auto;
  -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 18px;
  padding: 10px var(--gutter-r) calc(18px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  border-radius: 22px 22px 0 0;
  background: var(--surface); color: var(--ink);
  animation: rise .22s cubic-bezier(.2, .8, .2, 1);
}
.sheet::before { content: ""; flex: none; align-self: center; width: 38px; height: 5px; border-radius: 3px; background: var(--line); }
@keyframes rise { from { transform: translateY(40px); opacity: .6; } }
@media (min-width: 620px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 22px; } }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sheet-kicker { font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.score-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px 12px; }
.score-who { font-size: 18px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
.quick { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
.quick button { min-height: 44px; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font: 800 22px/1 var(--font-display); }
.quick button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.net-line { border: 0; border-top: 3px dashed var(--line); margin: 0; }
.sheet-actions { display: flex; flex-direction: column; gap: 10px; }
.p-head { display: flex; align-items: center; gap: 14px; }
.p-name { margin: 0 0 4px; font: 900 40px/.9 var(--font-display); text-transform: uppercase; overflow-wrap: anywhere; }
.p-sec { display: flex; flex-direction: column; gap: 12px; padding-top: 16px; border-top: 1px solid var(--line); }

.toast {
  position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  transform: translateX(-50%);
  width: max-content; max-width: min(92%, 420px);
  padding: 11px 15px; border-radius: 12px;
  background: var(--ink); color: var(--bg);
  font-size: 14px; font-weight: 600; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .18s;
}
.toast.is-on { opacity: 1; }

@media (max-width: 350px) {
  .mast-title { font-size: 40px; }
  .fonts-ok .mast-title { font-size: 50px; }
  .rank th, .rank td { padding-left: 3px; padding-right: 3px; }
  .names { font-size: 15px; }
  .score { font-size: 44px; }
  .stage { width: 184px; height: 184px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}</style>

<script id="app-code">/*QDP-JS*/
(function (root) {
'use strict';

/* ═══════════ Logica: calendario, classifica, schede ═══════════ */

// 45 giornate, una partita ciascuna: due coppie giocano, la terza riposa.
// Ogni voce è la partita "abcd": coppia a+b contro coppia c+d; riposano gli altri due.
// Sono tutte le 45 sfide possibili fra coppie. L'ordine è scelto perché nessuno riposi
// due giornate di fila e ogni tre giornate tutti abbiano giocato due volte.
var SCHEDULE_SRC = '0123 0345 1425 0234 0135 1245 0413 1524 0325 1234 0435 0215 1345 0523 0412 2435 0314 0125 0534 1235 0214 2345 0513 0124 0315 0425 1423 0524 1534 0213 1435 0423 0512 0134 0245 1325 0324 1523 0514 2534 0312 0145 0235 1324 0415';
var DEFAULT_PLAYERS = ['Tu', 'Betti', 'Ferra', 'Martina', 'Toffa', 'Vinci'];
var N_DAYS = 45;
var PRESETS = {
  lega: { win: 3, draw: 1, loss: 0, game: 0 },
  americano: { win: 0, draw: 0, loss: 0, game: 1 }
};
var SHOTS = ['Bandeja', 'Vibora', 'Smash', 'Por tres', 'Pallonetto', 'Volée', 'Chiquita', 'Bajada', 'Uscita di parete', 'Servizio'];
var SIDES = { dx: 'Lato destro', sx: 'Lato sinistro', ind: 'Destra o sinistra' };
var HANDS = { dx: 'Destro', sx: 'Mancino' };
var STYLES = { att: 'Attaccante', dif: 'Difensore', reg: 'Regista', jol: 'Jolly' };
var SKILLS = ['Smash', 'Volée', 'Difesa', 'Pallonetto', 'Gambe', 'Testa'];

function has(o, k) { return typeof k === 'string' && Object.prototype.hasOwnProperty.call(o, k); }

function buildSchedule() {
  return SCHEDULE_SRC.split(' ').map(function (id, g) {
    var a = [Number(id.charAt(0)), Number(id.charAt(1))], b = [Number(id.charAt(2)), Number(id.charAt(3))];
    var rest = [0, 1, 2, 3, 4, 5].filter(function (p) { return a.indexOf(p) < 0 && b.indexOf(p) < 0; });
    return { id: id, g: g, a: a, b: b, rest: rest };
  });
}

function clampInt(v, lo, hi, dflt) {
  if (v === null || v === undefined || v === '') return dflt;
  var n = Number(v);
  if (!isFinite(n)) return dflt;
  return Math.min(hi, Math.max(lo, Math.round(n)));
}

function cleanText(v, max) {
  var s = typeof v === 'string' ? v : '', out = '';
  for (var i = 0; i < s.length; i++) {
    var c = s.charCodeAt(i);
    out += c < 32 || c === 127 ? ' ' : s.charAt(i);
  }
  return out.replace(/\s+/g, ' ').trim().slice(0, max);
}

// La parola d'ordine è il nome: si confronta senza maiuscole, accenti e spazi.
var COMBINING = new RegExp('[' + String.fromCharCode(0x300) + '-' + String.fromCharCode(0x36f) + ']', 'g');
function normName(s) {
  var t = String(s === null || s === undefined ? '' : s).toLowerCase().trim();
  try { t = t.normalize('NFD').replace(COMBINING, ''); } catch (e) {}
  return t.replace(/[^a-z0-9]+/g, '') || t.replace(/\s+/g, '');
}
function findPlayer(state, word) {
  var w = normName(word);
  if (!w) return -1;
  for (var i = 0; i < state.players.length; i++) if (normName(state.players[i]) === w) return i;
  return -1;
}

function normProfile(p) {
  if (!p || typeof p !== 'object') return null;
  var skills = [];
  for (var k = 0; k < SKILLS.length; k++) skills.push(clampInt(p.skills && p.skills[k], 1, 10, 6));
  return {
    shot: cleanText(p.shot, 24) || SHOTS[0],
    side: has(SIDES, p.side) ? p.side : 'ind',
    hand: has(HANDS, p.hand) ? p.hand : 'dx',
    style: has(STYLES, p.style) ? p.style : 'jol',
    skills: skills,
    motto: cleanText(p.motto, 60)
  };
}
function normAvatar(v) {
  return typeof v === 'string' && v.length < 140000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(v) ? v : '';
}

function normalize(raw, schedule) {
  var s = raw && typeof raw === 'object' ? raw : {};
  var out = {
    v: 2,
    rev: clampInt(s.rev, 0, 1e9, 0),
    at: cleanText(s.at, 40),
    name: cleanText(s.name, 32) || 'Quelli del padel',
    players: [],
    rules: {},
    results: {},
    mvp: {},
    dates: {},
    extras: [],
    profiles: [],
    avatars: []
  };
  for (var i = 0; i < 6; i++) {
    out.players.push(cleanText(s.players && s.players[i], 14) || DEFAULT_PLAYERS[i]);
    out.profiles.push(normProfile(s.profiles && s.profiles[i]));
    out.avatars.push(normAvatar(s.avatars && s.avatars[i]));
  }
  var r = s.rules && typeof s.rules === 'object' ? s.rules : {};
  out.rules = {
    win: clampInt(r.win, -9, 20, 3),
    draw: clampInt(r.draw, -9, 20, 1),
    loss: clampInt(r.loss, -9, 20, 0),
    game: clampInt(r.game, 0, 5, 0)
  };
  var valid = {};
  schedule.forEach(function (m) { valid[m.id] = true; });
  var res = s.results && typeof s.results === 'object' ? s.results : {};
  Object.keys(res).forEach(function (id) {
    var v = res[id];
    if (!valid[id] || !Array.isArray(v) || v.length !== 2) return;
    var a = clampInt(v[0], 0, 99, NaN), b = clampInt(v[1], 0, 99, NaN);
    if (isNaN(a) || isNaN(b)) return;
    out.results[id] = [a, b];
  });
  // voti MVP: solo per partite giocate, solo dai quattro in campo, mai per sé stessi
  var mv = s.mvp && typeof s.mvp === 'object' ? s.mvp : {};
  schedule.forEach(function (m) {
    var v = mv[m.id];
    if (!v || typeof v !== 'object' || !out.results[m.id]) return;
    var P = matchPlayers(m), o = {}, any = false;
    P.forEach(function (p) {
      var pick = playerIdx(v[p]);
      if (pick < 0 || pick === p || P.indexOf(pick) < 0) return;
      o[p] = pick; any = true;
    });
    if (any) out.mvp[m.id] = o;
  });
  var d = s.dates && typeof s.dates === 'object' ? s.dates : {};
  for (var g = 0; g < N_DAYS; g++) {
    if (typeof d[g] === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d[g])) out.dates[g] = d[g];
  }
  (Array.isArray(s.extras) ? s.extras : []).slice(0, 80).forEach(function (e, idx) {
    if (!e || typeof e !== 'object') return;
    var p = clampInt(e.p, 0, 5, NaN), pts = clampInt(e.pts, -99, 99, NaN);
    if (isNaN(p) || isNaN(pts) || pts === 0) return;
    out.extras.push({ id: cleanText(String(e.id || ''), 16) || ('e' + idx), p: p, pts: pts, note: cleanText(e.note, 40) });
  });
  return out;
}

function resOf(gf, gs) { return gf > gs ? 'V' : gf === gs ? 'N' : 'P'; }

function matchPlayers(m) { return [m.a[0], m.a[1], m.b[0], m.b[1]]; }

// Indice di giocatore valido (0..5) oppure -1: un valore fuori posto si scarta, non si aggiusta.
function playerIdx(v) {
  if (v === null || v === undefined || v === '') return -1;
  var n = Number(v);
  return Number.isInteger(n) && n >= 0 && n <= 5 ? n : -1;
}

// MVP della partita: votano i quattro in campo, ognuno per uno degli altri tre.
// Lo prende chi ha più voti, purché almeno due; a parità è condiviso.
function mvpOf(state, m) {
  var v = state.mvp[m.id] || {}, P = matchPlayers(m), tally = {}, count = 0, max = 0;
  P.forEach(function (p) { tally[p] = 0; });
  P.forEach(function (p) { if (has(v, String(p))) { tally[v[p]]++; count++; } });
  P.forEach(function (p) { if (tally[p] > max) max = tally[p]; });
  return {
    votes: v, players: P, tally: tally, count: count, max: max,
    winners: max >= 2 ? P.filter(function (p) { return tally[p] === max; }) : []
  };
}

// Stagione: quante volte ognuno è stato MVP e quanti voti ha raccolto.
function mvpTable(state, schedule) {
  var rows = state.players.map(function (_, i) { return { i: i, mvp: 0, votes: 0, rank: 0 }; });
  schedule.forEach(function (m) {
    if (!state.results[m.id]) return;
    var r = mvpOf(state, m);
    r.players.forEach(function (p) { rows[p].votes += r.tally[p]; });
    r.winners.forEach(function (p) { rows[p].mvp++; });
  });
  var sorted = rows.slice().sort(function (a, b) { return (b.mvp - a.mvp) || (b.votes - a.votes) || (a.i - b.i); });
  sorted.forEach(function (r, idx) {
    var prev = sorted[idx - 1];
    r.rank = idx > 0 && prev.mvp === r.mvp && prev.votes === r.votes ? prev.rank : idx + 1;
  });
  return { rows: sorted, byPlayer: rows, any: rows.some(function (r) { return r.votes > 0; }) };
}

// Punti che una partita dà a ciascun giocatore della coppia.
function sidePoints(rules, gf, gs) {
  return (gf > gs ? rules.win : gf === gs ? rules.draw : rules.loss) + gf * rules.game;
}

function eachPlayed(state, schedule, fn) {
  schedule.forEach(function (m) {
    var r = state.results[m.id];
    if (r) fn(m, r[0], r[1]);
  });
}

function cmpStats(a, b) {
  return (b.pts - a.pts) || (b.dg - a.dg) || (b.gf - a.gf) || (b.v - a.v);
}

function computeTable(state, schedule) {
  var rows = state.players.map(function (_, i) {
    return { i: i, pg: 0, v: 0, n: 0, p: 0, gf: 0, gs: 0, dg: 0, pts: 0, extra: 0, form: [], rank: 0 };
  });
  var played = 0;
  eachPlayed(state, schedule, function (m, ga, gb) {
    played++;
    [[m.a, ga, gb], [m.b, gb, ga]].forEach(function (t) {
      var res = resOf(t[1], t[2]), pts = sidePoints(state.rules, t[1], t[2]);
      t[0].forEach(function (pl) {
        var r = rows[pl];
        r.pg++; r.gf += t[1]; r.gs += t[2]; r.pts += pts; r.form.push(res);
        if (res === 'V') r.v++; else if (res === 'N') r.n++; else r.p++;
      });
    });
  });
  state.extras.forEach(function (e) { rows[e.p].extra += e.pts; rows[e.p].pts += e.pts; });
  rows.forEach(function (r) { r.dg = r.gf - r.gs; });
  var sorted = rows.slice().sort(function (a, b) { return cmpStats(a, b) || (a.i - b.i); });
  sorted.forEach(function (r, idx) {
    r.rank = idx > 0 && cmpStats(sorted[idx - 1], r) === 0 ? sorted[idx - 1].rank : idx + 1;
  });
  return {
    rows: sorted,
    byPlayer: rows,
    played: played,
    hasData: played > 0 || state.extras.length > 0,
    draws: rows.some(function (r) { return r.n > 0; })
  };
}

// Prima giornata non ancora giocata; -1 se il campionato è finito.
function nextDay(state, schedule) {
  for (var g = 0; g < schedule.length; g++) if (!state.results[schedule[g].id]) return g;
  return -1;
}

// Il campionato visto da un giocatore: per ogni giornata, se gioca, con chi e com'è andata.
function playerLog(state, schedule, i) {
  return schedule.map(function (m) {
    var mine = m.a.indexOf(i) >= 0 ? m.a : m.b.indexOf(i) >= 0 ? m.b : null;
    if (!mine) return { m: m, plays: false, played: false, mate: m.rest[0] === i ? m.rest[1] : m.rest[0] };
    var r = state.results[m.id] || null;
    var o = { m: m, plays: true, played: !!r, mate: mine[0] === i ? mine[1] : mine[0], opps: mine === m.a ? m.b : m.a };
    if (r) {
      o.gf = mine === m.a ? r[0] : r[1];
      o.gs = mine === m.a ? r[1] : r[0];
      o.res = resOf(o.gf, o.gs);
      o.pts = sidePoints(state.rules, o.gf, o.gs);
    }
    return o;
  });
}

function tally() { return { pg: 0, v: 0, n: 0, p: 0, gf: 0, gs: 0, pts: 0 }; }
function addTally(t, res, gf, gs, pts) {
  t.pg++; t.gf += gf; t.gs += gs; t.pts += pts;
  if (res === 'V') t.v++; else if (res === 'N') t.n++; else t.p++;
}

function playerDetail(state, schedule, i) {
  var partners = {}, opponents = {};
  state.players.forEach(function (_, j) {
    if (j === i) return;
    partners[j] = tally(); opponents[j] = tally();
  });
  playerLog(state, schedule, i).forEach(function (e) {
    if (!e.played) return;
    addTally(partners[e.mate], e.res, e.gf, e.gs, e.pts);
    e.opps.forEach(function (o) { addTally(opponents[o], e.res, e.gf, e.gs, e.pts); });
  });
  function list(map) {
    return Object.keys(map).map(function (j) { var t = map[j]; t.j = Number(j); return t; });
  }
  return { partners: list(partners), opponents: list(opponents) };
}

function pairTable(state, schedule) {
  var map = {};
  function get(pair) {
    var k = pair[0] + '' + pair[1];
    if (!map[k]) { map[k] = tally(); map[k].a = pair[0]; map[k].b = pair[1]; }
    return map[k];
  }
  eachPlayed(state, schedule, function (m, ga, gb) {
    addTally(get(m.a), resOf(ga, gb), ga, gb, sidePoints(state.rules, ga, gb));
    addTally(get(m.b), resOf(gb, ga), gb, ga, sidePoints(state.rules, gb, ga));
  });
  return Object.keys(map).map(function (k) { var t = map[k]; t.dg = t.gf - t.gs; return t; })
    .sort(function (x, y) { return (y.pts - x.pts) || (y.dg - x.dg) || (y.gf - x.gf) || (x.pg - y.pg) || (x.a - y.a) || (x.b - y.b); });
}

function vote(p) {
  var s = 0;
  p.skills.forEach(function (v) { s += v; });
  return (s / p.skills.length).toFixed(1).replace('.', ',');
}

function fmtSigned(n) { return n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0'; }

function fmtDate(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if (!m) return '';
  var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  try { return d.toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' }); }
  catch (e) { return m[3] + '/' + m[2]; }
}

function pairName(state, pair, sep) { return state.players[pair[0]] + sep + state.players[pair[1]]; }

function dayLine(state, m) {
  var r = state.results[m.id];
  return pairName(state, m.a, ' + ') + (r ? '  ' + r[0] + '-' + r[1] + '  ' : ' contro ') + pairName(state, m.b, ' + ');
}

function tableText(state, schedule) {
  var T = computeTable(state, schedule);
  var lines = ['*' + state.name + '*', T.played ? 'Classifica dopo ' + T.played + (T.played === 1 ? ' partita' : ' partite') + ' su ' + N_DAYS : 'Classifica: si parte da zero'];
  T.rows.forEach(function (r) {
    lines.push((T.hasData ? r.rank : '-') + '. ' + state.players[r.i] + ' · ' + r.pts + ' pt' +
      (r.pg ? ' (' + r.v + 'V ' + (T.draws ? r.n + 'N ' : '') + r.p + 'P, DG ' + fmtSigned(r.dg) + ')' : ''));
  });
  var best = mvpTable(state, schedule).rows.filter(function (r) { return r.mvp > 0; });
  if (best.length) lines.push('', 'MVP: ' + best.map(function (r) { return state.players[r.i] + ' ' + r.mvp; }).join(', '));
  var nd = nextDay(state, schedule);
  if (nd >= 0) {
    lines.push('', 'Prossima, giornata ' + (nd + 1) + ': ' + dayLine(state, schedule[nd]), 'Riposano ' + pairName(state, schedule[nd].rest, ' e '));
  }
  return lines.join('\n');
}

function dayText(state, m) {
  var date = fmtDate(state.dates[m.g]);
  var lines = ['*' + state.name + '* · giornata ' + (m.g + 1) + (date ? ' (' + date + ')' : ''), dayLine(state, m), 'Riposano ' + pairName(state, m.rest, ' e ')];
  var w = state.results[m.id] ? mvpOf(state, m).winners : [];
  if (w.length) lines.push('MVP: ' + w.map(function (p) { return state.players[p]; }).join(' e '));
  return lines.join('\n');
}

/* Avatar caricatura: lavora sui pixel della foto, tutto sul telefono.
   bulge 0..0.55 gonfia il centro del viso; toon 0..1 è l'effetto fumetto
   (tinte piatte, colori più vivi, contorni a china). */
function toonify(src, w, h, bulge, toon) {
  var n = w * h, x, y, i, c, o, a = src;
  if (bulge > 0.001) {
    a = new Uint8ClampedArray(src.length);
    var cx = (w - 1) / 2, cy = (h - 1) * 0.52, R = Math.min(w, h) * 0.5;
    for (y = 0; y < h; y++) {
      for (x = 0; x < w; x++) {
        var dx = x - cx, dy = y - cy, r2 = (dx * dx + dy * dy) / (R * R), f = 1;
        if (r2 < 1) { var kk = 1 - r2; f = 1 - bulge * kk * kk; }
        var sx = cx + dx * f, sy = cy + dy * f;
        var x0 = Math.floor(sx), y0 = Math.floor(sy), fx = sx - x0, fy = sy - y0;
        if (x0 < 0) { x0 = 0; fx = 0; }
        if (y0 < 0) { y0 = 0; fy = 0; }
        var x1 = x0 + 1 < w ? x0 + 1 : w - 1, y1 = y0 + 1 < h ? y0 + 1 : h - 1;
        var p00 = (y0 * w + x0) * 4, p10 = (y0 * w + x1) * 4, p01 = (y1 * w + x0) * 4, p11 = (y1 * w + x1) * 4;
        o = (y * w + x) * 4;
        for (c = 0; c < 3; c++) {
          a[o + c] = (src[p00 + c] * (1 - fx) + src[p10 + c] * fx) * (1 - fy) + (src[p01 + c] * (1 - fx) + src[p11 + c] * fx) * fy;
        }
        a[o + 3] = 255;
      }
    }
  }
  var out = new Uint8ClampedArray(src.length);
  if (toon <= 0.01) {
    for (i = 0; i < n; i++) { o = i * 4; out[o] = a[o]; out[o + 1] = a[o + 1]; out[o + 2] = a[o + 2]; out[o + 3] = 255; }
    return out;
  }
  // 1) tinte piatte: per ogni punto, la media del quadrante più uniforme attorno
  var lum = new Float32Array(n);
  for (i = 0; i < n; i++) lum[i] = 0.299 * a[i * 4] + 0.587 * a[i * 4 + 1] + 0.114 * a[i * 4 + 2];
  var flat = new Float32Array(n * 3), rad = 2;
  var Q = [[-rad, 0, -rad, 0], [0, rad, -rad, 0], [-rad, 0, 0, rad], [0, rad, 0, rad]];
  for (y = 0; y < h; y++) {
    for (x = 0; x < w; x++) {
      var bestV = Infinity, br = 0, bg = 0, bb = 0;
      for (var q = 0; q < 4; q++) {
        var sr = 0, sg = 0, sb = 0, sl = 0, sl2 = 0, cnt = 0;
        for (var yy = y + Q[q][2]; yy <= y + Q[q][3]; yy++) {
          if (yy < 0 || yy >= h) continue;
          for (var xx = x + Q[q][0]; xx <= x + Q[q][1]; xx++) {
            if (xx < 0 || xx >= w) continue;
            var j = yy * w + xx, l = lum[j];
            sr += a[j * 4]; sg += a[j * 4 + 1]; sb += a[j * 4 + 2]; sl += l; sl2 += l * l; cnt++;
          }
        }
        var va = sl2 / cnt - (sl / cnt) * (sl / cnt);
        if (va < bestV) { bestV = va; br = sr / cnt; bg = sg / cnt; bb = sb / cnt; }
      }
      i = y * w + x;
      flat[i * 3] = br; flat[i * 3 + 1] = bg; flat[i * 3 + 2] = bb;
    }
  }
  var fl = new Float32Array(n);
  for (i = 0; i < n; i++) fl[i] = 0.299 * flat[i * 3] + 0.587 * flat[i * 3 + 1] + 0.114 * flat[i * 3 + 2];
  // 2) colori più vivi a gradini, 3) contorni scuri dove l'immagine cambia in fretta
  var INK = [12, 26, 53], mix = Math.min(1, toon * 1.25), step = 255 / 7;
  for (y = 0; y < h; y++) {
    var ym = y > 0 ? y - 1 : 0, yp = y < h - 1 ? y + 1 : h - 1;
    for (x = 0; x < w; x++) {
      var xm = x > 0 ? x - 1 : 0, xp = x < w - 1 ? x + 1 : w - 1;
      var gx = -fl[ym * w + xm] - 2 * fl[y * w + xm] - fl[yp * w + xm] + fl[ym * w + xp] + 2 * fl[y * w + xp] + fl[yp * w + xp];
      var gy = -fl[ym * w + xm] - 2 * fl[ym * w + x] - fl[ym * w + xp] + fl[yp * w + xm] + 2 * fl[yp * w + x] + fl[yp * w + xp];
      var e = Math.sqrt(gx * gx + gy * gy);
      var ink = e <= 55 ? 0 : e >= 190 ? 1 : (e - 55) / 135;
      ink = ink * ink * (3 - 2 * ink) * 0.85 * toon;
      i = y * w + x; o = i * 4;
      var gray = fl[i] * mix + lum[i] * (1 - mix);
      for (c = 0; c < 3; c++) {
        var val = a[o + c] * (1 - mix) + flat[i * 3 + c] * mix;
        val = gray + (val - gray) * (1 + 0.45 * toon);
        val = (val - 128) * (1 + 0.18 * toon) + 128 + 6 * toon;
        if (val < 0) val = 0; else if (val > 255) val = 255;
        val += (Math.round(val / step) * step - val) * 0.7 * toon;
        out[o + c] = val * (1 - ink) + INK[c] * ink;
      }
      out[o + 3] = 255;
    }
  }
  return out;
}

/* Archivio condiviso: ogni risultato, voto, data, bonus e scheda è un documento a sé,
   così più persone possono salvare nello stesso momento senza sovrascriversi.
   league/main         { name, players: {p0..p5}, rules }
   results/<partita>   { a, b }              votes/<partita>-<chi vota>  { p }
   dates/g<giornata>   { d }                 extras/<id>  { p, pts, note, at }
   profiles/p<i>       { profile, avatar }
   store = { league: oggetto | null | undefined, cols: { nome: {id: dati} | null }, over: modifiche in corso } */
function mergeStore(embed, store, schedule) {
  var raw = JSON.parse(JSON.stringify(embed)), L = store.league, C = store.cols || {}, O = store.over || {}, i;
  if (L && typeof L === 'object') {
    if (typeof L.name === 'string') raw.name = L.name;
    if (L.players && typeof L.players === 'object') {
      for (i = 0; i < 6; i++) if (typeof L.players['p' + i] === 'string') raw.players[i] = L.players['p' + i];
    }
    if (L.rules && typeof L.rules === 'object') raw.rules = { win: L.rules.win, draw: L.rules.draw, loss: L.rules.loss, game: L.rules.game };
  }
  if (O.name) raw.name = O.name.v;
  if (O.rules) raw.rules = O.rules.v;
  for (i = 0; i < 6; i++) if (O['p' + i]) raw.players[i] = O['p' + i].v;
  if (C.results) {
    raw.results = {};
    Object.keys(C.results).forEach(function (id) { var d = C.results[id]; if (d && typeof d === 'object') raw.results[id] = [d.a, d.b]; });
  }
  if (C.votes) {
    raw.mvp = {};
    Object.keys(C.votes).forEach(function (id) {
      var mm = /^(\d{4})-([0-5])$/.exec(id), d = C.votes[id];
      if (mm && d && typeof d === 'object') (raw.mvp[mm[1]] = raw.mvp[mm[1]] || {})[mm[2]] = d.p;
    });
  }
  if (C.dates) {
    raw.dates = {};
    Object.keys(C.dates).forEach(function (id) {
      var mm = /^g(\d{1,2})$/.exec(id), d = C.dates[id];
      if (mm && d && typeof d === 'object') raw.dates[Number(mm[1])] = d.d;
    });
  }
  if (C.extras) {
    raw.extras = Object.keys(C.extras).map(function (id) {
      var d = C.extras[id] && typeof C.extras[id] === 'object' ? C.extras[id] : {};
      return { id: id, p: d.p, pts: d.pts, note: d.note, at: typeof d.at === 'string' ? d.at : '' };
    }).sort(function (a, b) { return a.at < b.at ? -1 : a.at > b.at ? 1 : a.id < b.id ? -1 : a.id > b.id ? 1 : 0; });
  }
  if (C.profiles) {
    // una scheda mai salvata nell'archivio resta quella della copia nella pagina
    Object.keys(C.profiles).forEach(function (id) {
      var mm = /^p([0-5])$/.exec(id), d = C.profiles[id];
      if (!mm || !d || typeof d !== 'object') return;
      raw.profiles[Number(mm[1])] = d.profile || null;
      raw.avatars[Number(mm[1])] = typeof d.avatar === 'string' ? d.avatar : '';
    });
  }
  return normalize(raw, schedule);
}

/* Versione su GitHub: lo stesso archivio, tenuto in Cloud Firestore (Firebase).
   Traduce le chiamate e i codici d'errore di Firestore in quelli che la pagina già usa.
   La scrittura "update" diventa set con merge, che unisce anche i campi annidati. */
function firestoreDb(fs) {
  var MAP = { 'permission-denied': 'rejected', 'invalid-argument': 'rejected', 'failed-precondition': 'rejected', 'not-found': 'rejected',
    'out-of-range': 'rejected', 'unauthenticated': 'rejected', 'resource-exhausted': 'resource_exhausted' };
  function code(e) { return MAP[String((e && e.code) || '').replace(/^firestore\//, '')] || 'unavailable'; }
  function fail(e) { throw { code: code(e), message: (e && e.message) || '' }; }
  function listen(ref, next, err) {
    return ref.onSnapshot(next, function (e) { if (err) err({ code: 'unavailable', message: (e && e.message) || '' }); });
  }
  function docRef(path) {
    var r = fs.doc(path);
    return {
      set: function (d) { return r.set(d).then(null, fail); },
      update: function (d) { return r.set(d, { merge: true }).then(null, fail); },
      'delete': function () { return r['delete']().then(null, fail); },
      onSnapshot: function (next, err) { return listen(r, next, err); }
    };
  }
  return {
    doc: docRef,
    collection: function (path) {
      var c = fs.collection(path);
      return { onSnapshot: function (next, err) { return listen(c, next, err); } };
    }
  };
}

var schedule = buildSchedule();
var EMBED = (function () {
  try { return normalize(JSON.parse($('league-data').textContent), schedule); }
  catch (e) { return normalize({}, schedule); }
})();
var state = clone(EMBED);
var ui = { tab: 'io', filter: 'tutte', ex: { p: 0, pts: -1, note: '' } };
var me = null;        // giocatore entrato su questo dispositivo
var guest = false;    // sta solo guardando
var mine = null;      // la mia scheda tenuta su questo dispositivo: { i, profile, avatar }
var edit = null;      // editor della scheda aperto: { i, first, f }
var photo = { src: null, w: 0, h: 0, cx: 0, cy: 0, zoom: 1, timer: 0, ptr: {}, dist: 0 };
var COLS = ['results', 'votes', 'dates', 'extras', 'profiles'];
var live = {
  db: null, art: null,
  resolved: false,      // sappiamo se l'archivio condiviso c'è
  write: null,          // può scrivere: true, false, null = la piattaforma non l'ha detto
  admin: false,         // può anche rinnovare la copia nella pagina
  league: undefined,    // documento della lega: oggetto, null se non c'è, undefined se non ancora letto
  cols: { results: null, votes: null, dates: null, extras: null, profiles: null },
  fresh: {},            // letture confermate dall'archivio
  over: {},             // modifiche alla lega appena fatte, finché l'archivio non le conferma
  seq: 0, pending: 0, error: null, stale: false, timer: 0, frame: 0, chains: {}, copyBusy: false,
  hosted: false         // versione su GitHub con Firebase
};
var RO_MSG = 'Per segnare risultati e voti serve l\'invito con «Può modificare»: chiedilo a chi gestisce il campionato.';
var OFF_MSG = 'L\'archivio non risponde: controlla la connessione e riprova.';
function roMsg() { return live.hosted ? OFF_MSG : RO_MSG; }
function relayNote(what) {
  return live.hosted ? 'L\'archivio non risponde: mandalo nel gruppo e lo segna qualcun altro.'
    : 'Da qui ' + what + ' non si salva: mandalo nel gruppo e lo segna chi ha l\'invito «Può modificare».';
}
var WAIT_MSG = 'Un attimo, mi collego all\'archivio…';
var sheet = null;
var viewStale = false;
var started = false;
var toastTimer = 0;
var stashTimer = 0;
var calJump = false;

function loadMine() {
  mine = null;
  var mm = sGet(LS, K_MINE);
  if (!mm || me === null || mm.i !== me) return;
  var p = normProfile(mm.profile);
  if (!p) return;
  mine = { i: me, profile: p, avatar: normAvatar(mm.avatar) };
}

(function restore() {
  sDel(LS, 'qdp.draft.v2');   // bozze del vecchio salvataggio: non servono più
  var m = sGet(LS, K_ME);
  if (m && Number.isInteger(m.i) && m.i >= 0 && m.i < 6) me = m.i;
  guest = sGet(SS, K_GUEST) === 1;
  loadMine();
})();

function profileOf(i) { return mine && mine.i === i ? mine.profile : state.profiles[i]; }
function avatarOf(i) { return mine && mine.i === i ? mine.avatar : state.avatars[i]; }
function screen() { return edit ? 'edit' : (me === null && !guest) ? 'gate' : 'app'; }

/* ── Archivio condiviso ── */

// Comandi di modifica visibili: finché non sappiamo, restano; poi decide il permesso.
function canEdit() {
  if (!live.resolved) return true;
  return !!live.db && live.write !== false;
}
// Da qui si può solo mandare nel gruppo (archivio raggiungibile ma senza permesso, o assente).
function relay() { return live.resolved && !canEdit(); }
function ready() {
  if (!live.resolved) { toast(WAIT_MSG); return false; }
  if (!canEdit()) { toast(roMsg()); return false; }
  return true;
}
function allFresh() {
  return !!live.fresh.league && COLS.every(function (c) { return !!live.fresh[c]; });
}

function rebuild() {
  state = live.db ? mergeStore(EMBED, live, schedule) : clone(EMBED);
  // la scheda tenuta sul telefono non serve più quando l'archivio ha la stessa
  if (mine && live.fresh.profiles && same(mine.profile, state.profiles[mine.i]) && mine.avatar === state.avatars[mine.i]) {
    mine = null; sDel(LS, K_MINE);
  }
}

function isQuiet() {
  if (sheet) return false;
  var a = doc.activeElement;
  return !(a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.type !== 'range' && a.type !== 'file');
}

// Arrivano dati nuovi (anche dagli altri telefoni): ridisegna senza disturbare chi sta scrivendo.
function changed() {
  if (live.frame) return;
  live.frame = setTimeout(function () {
    live.frame = 0;
    rebuild();
    if (!started) return;
    renderMast(); renderTabs();
    if (sheet && sheet.type === 'mvp') refreshSheet();
    if (isQuiet() && !edit) renderView(); else viewStale = true;
  }, 30);
}

function subscribe() {
  var db = live.db;
  function onErr(e) {
    var code = e && e.code;
    if (code === 'revoked' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') { live.db = null; live.write = false; }
    live.stale = true;
    changed();
  }
  function fresh(key, meta) {
    if (!meta || !meta.fromCache) live.fresh[key] = true;
    if (allFresh()) { clearTimeout(live.timer); live.stale = false; }
  }
  try {
    db.doc('league/main').onSnapshot(function (snap) {
      live.league = snap.exists ? snap.data() : null;
      fresh('league', snap.metadata); changed();
    }, onErr);
    COLS.forEach(function (c) {
      db.collection(c).onSnapshot(function (qs) {
        var map = {};
        qs.docs.forEach(function (d) { if (d.exists) map[d.id] = d.data(); });
        live.cols[c] = map;
        fresh(c, qs.metadata); changed();
      }, onErr);
    });
  } catch (e) { live.db = null; changed(); return; }
  live.timer = setTimeout(function () { if (!allFresh()) { live.stale = true; renderMast(); } }, 10000);
}

function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
var FINAL = ['rejected', 'invalid_argument', 'resource_exhausted', 'quota_exceeded', 'revoked', 'not_granted', 'capability_disabled', 'capability_removed', 'transform_error'];

function attempt(path, kind, data, n) {
  return Promise.resolve().then(function () {
    var ref = live.db.doc(path);
    return kind === 'delete' ? ref.delete() : kind === 'update' ? ref.update(data) : ref.set(data);
  }).catch(function (e) {
    if (n === 0 && FINAL.indexOf(e && e.code) < 0) {
      return wait(700 + Math.floor(Math.random() * 1200)).then(function () { return attempt(path, kind, data, 1); });
    }
    throw e;
  });
}

// Una scrittura alla volta per documento, nell'ordine in cui le chiedi.
function put(path, kind, data) {
  if (!live.db) return Promise.resolve(false);
  live.pending++; live.error = null; renderMast();
  var job = (live.chains[path] || Promise.resolve()).then(function () { return attempt(path, kind, data, 0); });
  live.chains[path] = job.catch(function () {});
  return job.then(function () { live.pending--; renderMast(); return true; },
    function (e) { live.pending--; writeFailed(e); return false; });
}

function writeFailed(e) {
  var code = (e && e.code) || 'unavailable';
  if (code === 'invalid_argument' || code === 'transform_error' || code === 'revoked' || code === 'not_granted' ||
      code === 'capability_disabled' || code === 'capability_removed') {
    // l'archivio rifiuta le scritture di chi non ha il permesso di modifica
    if (code !== 'invalid_argument' && code !== 'transform_error') live.db = null;
    if (live.write !== false) toast(roMsg());
    live.write = false;
    if (sheet && (sheet.type === 'reset')) closeSheet();
    changed();
    return;
  }
  live.error = code;
  toast(code === 'rejected' ? 'L\'archivio ha rifiutato questa modifica: ricontrolla i dati e riprova.'
    : code === 'quota_exceeded' ? 'L\'archivio è pieno: non riesco a salvare altro.'
    : code === 'resource_exhausted' ? 'Troppe modifiche insieme: riprova tra qualche secondo.'
    : 'Non sono riuscito a salvare: controlla la connessione e riprova.');
  renderMast();
}

function playersMap(list) {
  var o = {};
  for (var i = 0; i < 6; i++) o['p' + i] = list[i];
  return o;
}

// Nome, giocatori e regole: si vedono subito, l'archivio li conferma poco dopo.
function leaguePut(patch) {
  if (!ready()) return Promise.resolve(false);
  if (live.db && live.league === undefined) { toast(WAIT_MSG); return Promise.resolve(false); }
  var key = ++live.seq, fields = [];
  if (has(patch, 'name')) fields.push(['name', patch.name]);
  if (has(patch, 'rules')) fields.push(['rules', patch.rules]);
  if (patch.players) Object.keys(patch.players).forEach(function (k) { fields.push([k, patch.players[k]]); });
  fields.forEach(function (f) { live.over[f[0]] = { v: f[1], k: key }; });
  changed();
  var data = patch, kind = 'update';
  if (!live.league) {
    kind = 'set';
    data = { name: state.name, players: playersMap(state.players), rules: clone(state.rules) };
    if (has(patch, 'name')) data.name = patch.name;
    if (has(patch, 'rules')) data.rules = patch.rules;
    if (patch.players) Object.keys(patch.players).forEach(function (k) { data.players[k] = patch.players[k]; });
  }
  return put('league/main', kind, data).then(function (ok) {
    fields.forEach(function (f) { if (live.over[f[0]] && live.over[f[0]].k === key) delete live.over[f[0]]; });
    changed();
    return ok;
  });
}

function stamp() { return new Date().toISOString(); }

function liveDocument() {
  var css = $('app-style').textContent.trim(), js = $('app-code').textContent.trim();
  if (css.indexOf('/*QDP-CSS*/') !== 0 || js.indexOf('/*QDP-JS*/') !== 0 || js.slice(-11) !== '/*QDP-END*/') throw new Error('source');
  var copy = clone(state);
  copy.rev = EMBED.rev + 1; copy.at = stamp();
  return buildDocument({ css: css, js: js, state: copy });
}

// Rinnova la copia nella pagina con i dati dell'archivio (per chi apre senza account).
function refreshCopy() {
  if (!live.art || !live.admin || live.copyBusy) return;
  var html;
  try { html = liveDocument(); } catch (e) { toast('Non riesco a preparare la copia.'); return; }
  live.copyBusy = true; saveUi(); renderView();
  Promise.resolve().then(function () { return live.art.publish(html); }).then(function () {
    live.copyBusy = false;
    toast('Copia aggiornata');
  }, function (e) {
    var code = e && e.code;
    live.copyBusy = false;
    toast(code === 'conflict' ? 'La pagina è appena cambiata: riprova.'
      : code === 'not_writer' || code === 'not_granted' ? 'Solo chi può modificare la pagina aggiorna la copia.'
      : 'Copia non aggiornata: riprova più tardi.');
    if (isQuiet()) renderView();
  });
}

function safeUse(c, name) {
  try { return Promise.resolve(c.use(name)).then(function (ns) { return ns || null; }, function () { return null; }); }
  catch (e) { return Promise.resolve(null); }
}
function ask(ns, fn, arg) {
  try { return typeof ns[fn] === 'function' ? Promise.resolve(ns[fn](arg)).then(null, function () { return null; }) : Promise.resolve(null); }
  catch (e) { return Promise.resolve(null); }
}

function initLive() {
  var cfg = root.QDP_FIREBASE_CONFIG;
  if (cfg && typeof cfg === 'object') { hookFirebase(cfg); return; }
  var tries = 0;
  (function attemptHook() {
    var c = root.claude;
    if (c && typeof c.use === 'function') { hook(c); return; }
    if (++tries > 8) { live.resolved = true; changed(); return; }
    setTimeout(attemptHook, 250);
  })();
}

function hookFirebase(cfg) {
  var fb = root.firebase;
  live.hosted = true;
  try {
    if (fb && typeof fb.initializeApp === 'function' && cfg.apiKey && cfg.projectId) {
      var app = fb.apps && fb.apps.length ? fb.app() : fb.initializeApp(cfg);
      live.db = firestoreDb(typeof app.firestore === 'function' ? app.firestore() : fb.firestore());
    }
  } catch (e) { live.db = null; }
  live.resolved = true;
  if (live.db) subscribe();
  changed();
}

function hook(c) {
  safeUse(c, 'db').then(function (ns) {
    live.db = ns && typeof ns.doc === 'function' && typeof ns.collection === 'function' ? ns : null;
    live.resolved = true;
    if (live.db) subscribe();
    changed();
  });
  safeUse(c, 'user').then(function (ns) {
    if (!ns) return;
    ask(ns, 'can', 'data.write').then(function (v) { if (v === true || v === false) { live.write = v; changed(); } });
    ask(ns, 'canEdit').then(function (v) { live.admin = v === true; changed(); });
  });
  safeUse(c, 'artifact').then(function (ns) { live.art = ns && typeof ns.publish === 'function' ? ns : null; changed(); });
}

function syncInfo() {
  if (!live.resolved) return { cls: 'busy', label: 'Mi collego…' };
  if (!live.db) return live.hosted ? { cls: 'err', label: 'Non collegato' } : { cls: 'ro', label: 'Copia salvata' };
  if (live.pending) return { cls: 'busy', label: 'Salvo…' };
  if (live.error) return { cls: 'err', label: 'Non salvato' };
  if (live.stale) return { cls: 'err', label: 'Non in linea' };
  if (live.write === false) return { cls: 'ro', label: 'Sola lettura' };
  return allFresh() ? { cls: 'ok', label: 'In diretta' } : { cls: 'busy', label: 'Mi collego…' };
}

/* ── Piccoli aiuti ── */

function toast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('is-on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('is-on'); }, 3400);
}
function uiSnapshot() {
  return {
    tab: ui.tab, filter: ui.filter, t: Date.now(),
    sheet: sheet && sheet.type === 'score' ? { type: 'score', id: sheet.m.id, vals: clone(sheet.vals) }
      : sheet && sheet.type === 'mvp' ? { type: 'mvp', id: sheet.m.id, score: sheet.score || state.results[sheet.m.id] || null } : null,
    edit: edit ? { i: edit.i, first: edit.first, f: edit.f } : null
  };
}
function saveUi() { sSet(SS, K_UI, uiSnapshot()); }
function stashSoon() { clearTimeout(stashTimer); stashTimer = setTimeout(saveUi, 400); }
function findMatch(id) {
  for (var g = 0; g < schedule.length; g++) if (schedule[g].id === id) return schedule[g];
  return null;
}
function tabFromHash() {
  var h = '';
  try { h = (location.hash || '').replace(/^#/, ''); } catch (e) {}
  return TABS.indexOf(h) >= 0 ? h : '';
}
function scrollTop() { try { root.scrollTo(0, 0); } catch (e) {} }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
function nm(i) { return esc(state.players[i]); }
function nameSpan(i) { return '<span' + (i === me ? ' class="is-self"' : '') + '>' + nm(i) + '</span>'; }
function avatarHtml(i, cls) {
  var src = avatarOf(i);
  return '<span class="av' + (cls ? ' ' + cls : '') + '">' + (src ? '<img src="' + src + '" alt="">' : esc(state.players[i].charAt(0))) + '</span>';
}

/* ── Testata e barra ── */

function renderMast() {
  var sc = screen(), s = syncInfo(), chip = '', h;
  if (s) {
    chip = s.act
      ? '<button type="button" class="sync is-' + s.cls + '" id="sync" data-act="sync"><i></i>' + s.label + '</button>'
      : '<span class="sync is-' + s.cls + '" id="sync"><i></i>' + s.label + '</span>';
  }
  var T = computeTable(state, schedule);
  if (sc === 'app' && ui.tab === 'io' && me !== null) {
    var row = T.byPlayer[me], p = profileOf(me);
    h = '<div class="mast-in"><div class="mast-top"><span class="mast-kicker">' + esc(state.name) + '</span>' + chip + '</div>' +
      '<div class="mast-court"><div class="mast-left is-me">' + avatarHtml(me, 'av-xl') +
      '<div><h1 class="mast-title">' + nm(me) + '<span class="ball" aria-hidden="true"></span></h1>' +
      (p ? '<p class="mast-sub">' + esc(p.shot) + ' · ' + STYLES[p.style] + '</p>' : '') + '</div></div>' +
      '<div class="mast-right"><div class="mast-box"><span class="l">Posizione</span><span class="n">' + (T.hasData ? row.rank + 'º' : '–') + '</span></div>' +
      '<div class="mast-box"><span class="l">Punti</span><span class="n">' + row.pts + '</span></div></div></div></div>';
  } else if (sc === 'gate' || (sc === 'app' && (ui.tab === 'classifica' || ui.tab === 'io'))) {
    var nd = nextDay(state, schedule);
    var lead = T.rows.filter(function (r) { return r.rank === 1; });
    h = '<div class="mast-in"><div class="mast-top"><span class="mast-kicker">Campionato individuale</span>' + chip + '</div>' +
      '<div class="mast-court"><div class="mast-left"><h1 class="mast-title">' + esc(state.name) + '<span class="ball" aria-hidden="true"></span></h1></div>' +
      '<div class="mast-right"><div class="mast-box"><span class="l">' + (nd >= 0 ? 'Giornata' : 'Giornate') + '</span><span class="n">' + (nd >= 0 ? nd + 1 : N_DAYS) + '<small>/' + N_DAYS + '</small></span></div>' +
      '<div class="mast-box"><span class="l">In testa</span><span class="n is-name">' + (!T.hasData ? '–' : lead.length === 1 ? nm(lead[0].i) : 'Pari') + '</span></div></div></div></div>';
  } else {
    var title = sc === 'edit' ? (edit.i === me ? 'La tua scheda' : 'Scheda di ' + nm(edit.i)) : esc(state.name);
    h = '<div class="mast-in mast-slim"><span class="mast-name">' + title + '</span>' + chip + '</div>';
  }
  $('mast').innerHTML = h;
}

function renderTabs() {
  $('tabs').innerHTML = '<div class="tabs-in">' + TABS.map(function (t) {
    var icon = t === 'io' && me !== null && avatarOf(me) ? avatarHtml(me, 'av-xs') : ICONS[t];
    return '<a class="tab" href="#' + t + '" data-act="tab" data-tab="' + t + '"' + (ui.tab === t ? ' aria-current="page"' : '') + '>' + icon + '<span>' + LABELS[t] + '</span></a>';
  }).join('') + '</div>';
}

/* ── Ingresso ── */

function viewGate() {
  return '<section class="block" aria-labelledby="h-gate"><div class="block-head"><h2 id="h-gate">Entra in campo</h2></div>' +
    '<p class="note">Ognuno ha la sua area personale. La parola d\'ordine è il tuo nome.</p>' +
    '<form class="gate-form" id="login-form" novalidate>' +
    '<div class="field"><label for="f-word">Parola d\'ordine</label>' +
    '<input type="text" id="f-word" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" maxlength="20" placeholder="Scrivila qui"></div>' +
    '<p class="err" id="login-err" role="alert" hidden></p>' +
    '<button type="submit" class="btn primary wide" id="b-login">Entra</button></form>' +
    (guest ? '' : '<button type="button" class="btn quiet wide" id="b-guest" data-act="guest">Dai solo un\'occhiata</button>') +
    (live.resolved && canEdit() && state.players.indexOf('Tu') >= 0 ? '<p class="note">Prima volta? Il tuo posto si chiama ancora «Tu»: entra con quella parola e scegli il tuo nome.</p>' : '') +
    '</section>';
}

function login(i) {
  me = i; guest = false;
  sSet(LS, K_ME, { i: i });
  sDel(SS, K_GUEST);
  loadMine();
  try { if (doc.activeElement) doc.activeElement.blur(); } catch (e) {}
  if (!profileOf(i)) { openEdit(i, true); return; }
  ui.tab = 'io';
  go();
}

function logout() {
  me = null; mine = null; edit = null; guest = false;
  sDel(LS, K_ME); sDel(SS, K_GUEST);
  closeSheet();
  ui.tab = 'io';
  go();
}

function go() {
  saveUi();
  try { if (location.hash !== '#' + ui.tab) location.hash = ui.tab; } catch (e) {}
  render();
  scrollTop();
}

/* ── Pezzi comuni ── */

function formDots(form) {
  if (!form.length) return '';
  var last = form.slice(-5);
  return '<span class="form" role="img" aria-label="Ultime partite: ' + last.join(', ') + '">' +
    last.map(function (r) { return '<i class="f f-' + r + '"></i>'; }).join('') + '</span>';
}

function mvpText(mv) {
  if (mv.winners.length) {
    return '<span class="star" aria-hidden="true">★</span><span><b>MVP ' + mv.winners.map(nm).join(' e ') + '</b>' + (mv.count < 4 ? ' · ' + plural(mv.count, 'voto', 'voti') + ' su 4' : '') + '</span>';
  }
  return '<span class="star is-off" aria-hidden="true">★</span><span>MVP da votare' + (mv.count ? ' · ' + plural(mv.count, 'voto', 'voti') + ' su 4' : '') + '</span>';
}

// Chi può scrivere inserisce o modifica; chi è in sola lettura manda risultato o voto nel gruppo.
function matchAction(m) {
  var r = state.results[m.id];
  if (canEdit()) return { act: 'edit-match', label: r ? 'Modifica' : 'Inserisci risultato' };
  if (!r) return { act: 'edit-match', label: 'Manda il risultato' };
  if (me !== null && matchPlayers(m).indexOf(me) >= 0 && !has(state.mvp[m.id] || {}, String(me))) return { act: 'open-mvp', label: 'Manda il voto MVP' };
  return null;
}

function matchCard(m) {
  var r = state.results[m.id], wa = r && r[0] > r[1], wb = r && r[1] > r[0], ma = matchAction(m), editable = !!ma;
  var date = fmtDate(state.dates[m.g]);
  var label = 'Giornata ' + (m.g + 1) + ': ' + pairName(state, m.a, ' e ') + ' contro ' + pairName(state, m.b, ' e ') +
    (r ? ', ' + r[0] + ' a ' + r[1] + '. Modifica il risultato' : '. Inserisci il risultato');
  var open = editable
    ? '<button type="button" class="match' + (r ? '' : ' is-empty') + '" id="m-' + m.id + '" data-act="' + ma.act + '" data-id="' + m.id + '" aria-label="' + esc(label) + '">'
    : '<div class="match' + (r ? '' : ' is-empty') + '">';
  var cta = editable ? '<span class="match-cta">' + ma.label + '</span>'
    : (r ? '' : '<span class="match-cta is-off">da giocare</span>');
  function side(cls, pair, score, win, lose) {
    return '<span class="side ' + cls + (win ? ' is-win' : lose ? ' is-lose' : '') + '">' +
      '<span class="names">' + nameSpan(pair[0]) + nameSpan(pair[1]) + '</span>' +
      '<span class="score">' + score + '</span></span>';
  }
  return open +
    '<span class="match-meta"><span><b>Giornata ' + (m.g + 1) + '</b>' + (date ? ' · ' + esc(date) : '') + ' · riposano ' + nm(m.rest[0]) + ' e ' + nm(m.rest[1]) + '</span>' + cta + '</span>' +
    '<span class="court"><span class="court-in">' +
    side('side-a', m.a, r ? r[0] : '–', wa, wb) + '<span class="net" aria-hidden="true"></span>' + side('side-b', m.b, r ? r[1] : '–', wb, wa) +
    '</span></span>' + (r ? '<span class="match-mvp">' + mvpText(mvpOf(state, m)) + '</span>' : '') + (editable ? '</button>' : '</div>');
}

function kpisHtml(row, T, mv) {
  var perc = row.pg ? Math.round(100 * row.v / row.pg) + '%' : '–';
  var avg = row.pg ? ((row.pts - row.extra) / row.pg).toFixed(1).replace('.', ',') : '–';
  return '<dl class="kpis">' +
    '<div><dt>Partite giocate</dt><dd>' + row.pg + '</dd></div>' +
    '<div><dt>Vinte · ' + (T.draws ? 'pari · ' : '') + 'perse</dt><dd>' + row.v + '·' + (T.draws ? row.n + '·' : '') + row.p + '</dd></div>' +
    '<div><dt>Vittorie</dt><dd>' + perc + '</dd></div>' +
    '<div><dt>Game vinti · persi</dt><dd>' + row.gf + '·' + row.gs + '</dd></div>' +
    '<div><dt>Differenza game</dt><dd>' + fmtSigned(row.dg) + '</dd></div>' +
    '<div><dt>Punti a partita</dt><dd>' + avg + '</dd></div></dl>' +
    (row.form.length ? '<div class="lastfive"><span>Ultime partite</span><span class="res-list">' +
      row.form.slice(-5).map(function (r) { return '<span class="res res-' + r + '">' + r + '</span>'; }).join('') + '</span></div>' : '') +
    (mv && mv.votes ? '<p class="mvp-line"><span class="star" aria-hidden="true">★</span><span>MVP ' + plural(mv.mvp, 'volta', 'volte') + ' · ' + plural(mv.votes, 'voto ricevuto', 'voti ricevuti') + '</span></p>' : '') +
    (row.extra ? '<p class="hint">Bonus e malus: ' + fmtSigned(row.extra) + ' (già nei punti)</p>' : '');
}

function schedaHtml(p) {
  if (!p) return '<p class="note">Scheda non ancora compilata.</p>';
  return '<div class="tags"><span class="tagp is-shot">' + esc(p.shot) + '</span><span class="tagp">' + SIDES[p.side] + '</span>' +
    '<span class="tagp">' + HANDS[p.hand] + '</span><span class="tagp">' + STYLES[p.style] + '</span></div>' +
    (p.motto ? '<p class="motto">«' + esc(p.motto) + '»</p>' : '') +
    '<div class="skills">' + SKILLS.map(function (label, k) {
      return '<div class="skill"><span>' + label + '</span><span class="bar"><i style="width:' + (p.skills[k] * 10) + '%"></i></span><b>' + p.skills[k] + '</b></div>';
    }).join('') + '</div>';
}

function rate(t) { return t.pg ? t.v / t.pg : -1; }
function miniHead(first, T, withPts) {
  return '<thead><tr><th class="c-who" scope="col">' + first + '</th><th scope="col"><abbr title="Partite giocate">PG</abbr></th>' +
    '<th scope="col"><abbr title="Vinte">V</abbr></th>' + (T.draws ? '<th scope="col"><abbr title="Pareggiate">N</abbr></th>' : '') +
    '<th scope="col"><abbr title="Perse">P</abbr></th><th scope="col"><abbr title="Differenza game">DG</abbr></th>' +
    (withPts ? '<th scope="col"><abbr title="Punti">PT</abbr></th>' : '') + '</tr></thead>';
}
function miniRows(list, kind, T, tagFor) {
  var h = '';
  list.forEach(function (t) {
    var tag = tagFor(t);
    h += '<tr><th class="c-who" scope="row">' + (kind === 'pair' ? nm(t.a) + ' + ' + nm(t.b) : nm(t.j)) +
      (tag ? '<span class="tag">' + tag + '</span>' : '') + '</th><td>' + t.pg + '</td><td>' + t.v + '</td>' +
      (T.draws ? '<td>' + t.n + '</td>' : '') + '<td>' + t.p + '</td><td>' + fmtSigned(t.gf - t.gs) + '</td>' +
      (kind === 'opp' ? '' : '<td class="strong">' + t.pts + '</td>') + '</tr>';
  });
  return h;
}
function sortPartners(det) {
  return det.partners.slice().sort(function (a, b) { return (rate(b) - rate(a)) || ((b.gf - b.gs) - (a.gf - a.gs)) || (a.j - b.j); });
}
function sortOpponents(det) {
  return det.opponents.slice().sort(function (a, b) { return (b.p - a.p) || (rate(a) - rate(b)) || (a.j - b.j); });
}

/* ── Io: l'area personale ── */

      '<div class="actions"><button type="button" class="btn primary" id="b-edit-me" data-act="edit-profile" data-i="' + me + '">Crea la tua scheda</button></div>';

    if (worstOk) h += '<div class="card"><span class="label">Bestia nera</span><span class="duo-who">' + avatarHtml(opps[0].j, '') + nm(opps[0].j) + '</span>' +
      '<span class="hint">' + opps[0].p + ' perse su ' + opps[0].pg + ' contro</span></div>';
    h += '</div></section>';
  }

  h += '<div class="actions"><button type="button" class="btn quiet" id="b-logout" data-act="logout">Esci da ' + nm(me) + '</button></div>';
  return h;
}

  var restTxt = resting ? 'riposi tu con ' + nm(m.rest[0] === me ? m.rest[1] : m.rest[0]) : 'riposano ' + nm(m.rest[0]) + ' e ' + nm(m.rest[1]);

/* ── Lega ── */

function fmtStamp(iso) {
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  try { return d.toLocaleString('it-IT', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
  catch (e) { return iso.slice(0, 10); }
}

function sameRules(a, b) { return a.win === b.win && a.draw === b.draw && a.loss === b.loss && a.game === b.game; }
