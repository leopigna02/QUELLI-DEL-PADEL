function cropRect() {
  var side = Math.min(photo.w, photo.h) / photo.zoom;
  var x0 = Math.min(Math.max(photo.cx - side / 2, 0), photo.w - side);
  var y0 = Math.min(Math.max(photo.cy - side / 2, 0), photo.h - side);
  photo.cx = x0 + side / 2; photo.cy = y0 + side / 2;
  return { x: x0, y: y0, side: side };
}

// fast = solo ritaglio (mentre si trascina); altrimenti applica caricatura e fumetto.
function paintStage(fast) {
  var cv = $('stage-cv');
  if (!cv || !photo.src || !edit) return;
  var ctx = cv.getContext('2d'), r = cropRect();
  ctx.drawImage(photo.src, r.x, r.y, r.side, r.side, 0, 0, AV, AV);
  if (fast) return;
  try {
    var img = ctx.getImageData(0, 0, AV, AV);
    img.data.set(toonify(img.data, AV, AV, edit.f.bulge / 100 * 0.55, edit.f.toon / 100));
    ctx.putImageData(img, 0, 0);
    edit.f.avatar = normAvatar(cv.toDataURL('image/jpeg', 0.84));
  } catch (e) {}
  stashSoon();
}
function paintSoon(ms) {
  clearTimeout(photo.timer);
  photo.timer = setTimeout(function () { paintStage(false); }, ms === undefined ? 140 : ms);
}

function loadPhoto(file) {
  if (!file) return;
  var url;
  try { url = URL.createObjectURL(file); } catch (e) { toast('Non riesco ad aprire questa foto.'); return; }
  var img = new Image();
  img.onload = function () {
    var w = img.naturalWidth, hh = img.naturalHeight, s = Math.min(1, 1024 / Math.max(w, hh, 1));
    var c = doc.createElement('canvas');
    c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(hh * s));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    try { URL.revokeObjectURL(url); } catch (e) {}
    photo.src = c; photo.w = c.width; photo.h = c.height;
    photo.cx = c.width / 2; photo.cy = c.height * 0.45; photo.zoom = 1; photo.ptr = {}; photo.dist = 0;
    if (edit) { renderView(); }
  };
  img.onerror = function () {
    try { URL.revokeObjectURL(url); } catch (e) {}
    toast('Non riesco a leggere questa foto: provane un\'altra.');
  };
  img.src = url;
}

function stagePointers(cv) {
  function pts() { return Object.keys(photo.ptr).map(function (k) { return photo.ptr[k]; }); }
  function spread() { var p = pts(); return p.length < 2 ? 0 : Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y); }
  cv.addEventListener('pointerdown', function (ev) {
    photo.ptr[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
    photo.dist = spread();
    try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
    ev.preventDefault();
  });
  cv.addEventListener('pointermove', function (ev) {
    var p = photo.ptr[ev.pointerId];
    if (!p) return;
    var n = pts().length, r = cropRect(), k = r.side / (cv.clientWidth || AV);
    if (n === 1) {
      photo.cx -= (ev.clientX - p.x) * k; photo.cy -= (ev.clientY - p.y) * k;
    }
    p.x = ev.clientX; p.y = ev.clientY;
    if (n >= 2) {
      var d = spread();
      if (photo.dist > 0 && d > 0) {
        photo.zoom = Math.min(4, Math.max(1, photo.zoom * d / photo.dist));
        var z = $('e-zoom'); if (z) z.value = Math.round(photo.zoom * 100);
      }
      photo.dist = d;
    }
    paintStage(true);
    paintSoon();
  });
  function up(ev) { delete photo.ptr[ev.pointerId]; photo.dist = spread(); paintSoon(60); }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
}

function saveEdit() {
  var f = edit.f, i = edit.i, own = i === me;
  var shot = f.shot === 'altro' ? cleanText(f.other, 24) : f.shot;
  if (!shot) {
    toast('Scegli il tuo colpo preferito.');
    try { $('h-shot').scrollIntoView({ block: 'center' }); } catch (e) {}
    return;
  }
  if (!live.resolved) { toast(WAIT_MSG); return; }
  var writer = canEdit() && !!live.db, name = cleanText(f.name, 14), rename = '';
  if (writer && name && name !== state.players[i]) {
    var clash = findPlayer(state, name);
    if (clash >= 0 && clash !== i) { toast('C\'è già un giocatore con questo nome.'); return; }
    rename = name;
  }
  if (!writer && !own) { toast(roMsg()); return; }
  if (rename && live.league === undefined) { toast(WAIT_MSG); return; }
  if (photo.src) { clearTimeout(photo.timer); paintStage(false); }
  var prof = normProfile({ shot: shot, side: f.side, hand: f.hand, style: f.style, skills: f.skills, motto: f.motto });
  var avatar = normAvatar(f.avatar);
  if (own) { mine = { i: i, profile: prof, avatar: avatar }; sSet(LS, K_MINE, mine); }
  edit = null; photo.src = null;
  if (own) ui.tab = 'io';

    put('profiles/p' + i, 'set', { profile: prof, avatar: avatar, at: stamp() });
    if (rename) { var pl = {}; pl['p' + i] = rename; leaguePut({ players: pl }); }
  }
  render();
  try { if (location.hash !== '#' + ui.tab) location.hash = ui.tab; } catch (e) {}
  scrollTop();
  toast(writer ? 'Scheda salvata' : 'Scheda salvata su questo telefono');
}

function renderView() {

  var T = computeTable(state, schedule), row = T.byPlayer[i], p = profileOf(i), det = playerDetail(state, schedule, i);
  var partners = sortPartners(det), opps = sortOpponents(det), M = mvpTable(state, schedule);
  var best = partners.filter(function (t) { return t.pg > 0; }).length >= 2 && partners[0].v > 0 ? partners[0].j : -1;
  var worst = opps[0].p > 0 && opps[0].p > opps[0].v ? opps[0].j : -1;
  var h = '<div class="sheet-head"><div class="p-head">' + avatarHtml(i, 'av-l' + (i === me ? ' is-ring' : '')) +
    '<div><h2 class="p-name" id="sh-title">' + nm(i) + '</h2><p class="hint">' + (T.hasData ? row.rank + 'º in classifica · ' : '') + row.pts + ' punti' + (p ? ' · pagella ' + vote(p) : '') + '</p></div></div>' +
    '<button type="button" class="x" data-act="close-sheet" aria-label="Chiudi">×</button></div>';
  h += schedaHtml(p);
  h += '<div class="p-sec"><h3>Numeri</h3>' + kpisHtml(row, T, M.byPlayer[i]) + '</div>';
  h += '<div class="p-sec"><h3>In coppia con</h3><div class="card"><table class="rank mini">' + miniHead('Compagno', T, true) + '<tbody>' +
    miniRows(partners, 'mate', T, function (t) { return t.j === best ? 'miglior intesa' : ''; }) + '</tbody></table></div></div>';
  h += '<div class="p-sec"><h3>Contro</h3><div class="card"><table class="rank mini">' + miniHead('Avversario', T, false) + '<tbody>' +
    miniRows(opps, 'opp', T, function (t) { return t.j === worst ? 'bestia nera' : ''; }) + '</tbody></table></div></div>';
  if (i === me || canEdit()) {
    h += '<div class="sheet-actions"><button type="button" class="btn wide" data-act="edit-profile" data-i="' + i + '">' + (p ? 'Modifica la scheda' : 'Compila la scheda') + '</button></div>';
  }
  return h;
}

// Voti registrati; con mine === true anche quelli appena toccati su questo telefono.
function mvpVals(withTouched) {
  var m = sheet.m, cur = state.mvp[m.id] || {}, vals = {};
  matchPlayers(m).forEach(function (p) { vals[p] = has(cur, String(p)) ? cur[p] : null; });
  if (withTouched !== false) Object.keys(sheet.touched).forEach(function (k) { vals[k] = sheet.touched[k]; });
  return vals;
}

function mvpNow(vals) {
  var P = matchPlayers(sheet.m), tally = {}, count = 0, max = 0;
  P.forEach(function (p) { tally[p] = 0; });
  P.forEach(function (p) { var v = vals[p]; if (v !== null && v !== undefined) { tally[v]++; count++; } });
  P.forEach(function (p) { if (tally[p] > max) max = tally[p]; });
  if (!count) return 'Ancora nessun voto.';
  var top = P.filter(function (p) { return tally[p] === max; });
  var txt = P.filter(function (p) { return tally[p] > 0; }).sort(function (a, b) { return tally[b] - tally[a]; })
    .map(function (p) { return nm(p) + ' ' + tally[p]; }).join(' · ');
  return (max >= 2 ? '<b>MVP ' + top.map(nm).join(' e ') + '</b> · ' : '') + txt + ' · ' + plural(count, 'voto', 'voti') + ' su 4';
}

function voteRow(voter, vals) {
  var P = matchPlayers(sheet.m), voted = vals[voter] !== null && vals[voter] !== undefined;
  return '<div class="field"><span class="label" id="mv-l' + voter + '">' + (voter === me ? 'Il tuo voto' : 'Il voto di ' + nm(voter)) +
    (voter !== me && !voted ? ' · deve ancora votare' : '') + '</span>' +
    '<div class="seg" role="group" aria-labelledby="mv-l' + voter + '">' +
    P.filter(function (p) { return p !== voter; }).map(function (p) {
      return '<button type="button" data-act="mvp-pick" data-voter="' + voter + '" data-p="' + p + '" aria-pressed="' + (vals[voter] === p) + '">' + nm(p) + '</button>';
    }).join('') + '</div></div>';
}

function mvpSheet() {
  var m = sheet.m, r = sheet.score || state.results[m.id], P = matchPlayers(m), vals = mvpVals(), mine2 = me !== null && P.indexOf(me) >= 0;
  var h = sheetHead('Giornata ' + (m.g + 1) + ' · ' + nm(m.a[0]) + ' e ' + nm(m.a[1]) + (r ? ' ' + r[0] + '–' + r[1] + ' ' : ' contro ') + nm(m.b[0]) + ' e ' + nm(m.b[1]), 'Chi è stato l\'MVP?');
  if (relay()) {
    h += '<p class="note">' + relayNote('il voto') + '</p>';
    if (mine2) {
      h += voteRow(me, vals) + '<p class="mvp-now" id="mvp-now" aria-live="polite">Voti già segnati: ' + mvpNow(mvpVals(false)) + '</p>' +
        '<div class="sheet-actions"><button type="button" class="btn primary wide" id="mvp-send" data-act="mvp-relay"' + (sheet.touched[me] === null || sheet.touched[me] === undefined ? ' disabled' : '') + '>Manda il voto nel gruppo</button></div>';
    } else {
      h += '<p class="note">' + (me === null ? 'Votano solo i quattro in campo: entra con la tua parola d\'ordine.' : 'Non eri in campo in questa partita: votano solo i quattro che hanno giocato.') + '</p>' +
        '<p class="mvp-now" id="mvp-now" aria-live="polite">' + mvpNow(vals) + '</p>';
    }
    return h;
  }
  var order = P.slice();
  if (mine2) { order.splice(order.indexOf(me), 1); order.unshift(me); }
  h += '<p class="note">Votano i quattro in campo, ognuno per uno degli altri tre. Il voto si salva appena tocchi un nome; toccalo di nuovo per toglierlo.</p>';
  order.forEach(function (voter) { h += voteRow(voter, vals); });
  return h + '<p class="mvp-now" id="mvp-now" aria-live="polite">' + mvpNow(vals) + '</p>' +
    '<p class="hint">Se qualcuno non ha l\'app, puoi segnare tu il suo voto.</p>' +
    '<div class="sheet-actions"><button type="button" class="btn primary wide" id="mvp-done" data-act="close-sheet">Fatto</button></div>';
}

function openMvp(m, score) {
  openSheet({ type: 'mvp', m: m, touched: {}, score: score || null });
}

function refreshSheet() {
  var el = $('sheet');
  if (!el || !sheet) return;
  var top = el.scrollTop;
  el.innerHTML = sheetHtml();
  el.scrollTop = top;
}

function resultText(m, vals) {
  var date = fmtDate(state.dates[m.g]);
  return ['*' + state.name + '* · giornata ' + (m.g + 1) + (date ? ' (' + date + ')' : ''),
    'Risultato: ' + pairName(state, m.a, ' + ') + '  ' + vals[0] + '-' + vals[1] + '  ' + pairName(state, m.b, ' + '),
    me !== null ? '(lo manda ' + state.players[me] + ', da segnare nell\'app)' : '(da segnare nell\'app)'].join('\n');
}

function voteText(m, voter, pick) {
  return '*' + state.name + '* · giornata ' + (m.g + 1) + '\nVoto MVP di ' + state.players[voter] + ': ' + state.players[pick] + '\n(da segnare nell\'app)';
}

function sheetHtml() {
  if (sheet.type === 'score') {
    var m = sheet.m, filled = sheet.vals[0] !== null && sheet.vals[1] !== null, ro = relay(), has2 = !!state.results[m.id];
    return sheetHead('Giornata ' + (m.g + 1) + ' · riposano ' + nm(m.rest[0]) + ' e ' + nm(m.rest[1]), 'Risultato') +
      (ro ? '<p class="note">' + relayNote('il risultato') + '</p>' : '') +
      scoreRow(0, m.a) + '<hr class="net-line">' + scoreRow(1, m.b) +
      (ro ? '' : '<div class="field"><label for="f-date">Data della giornata</label><input type="date" id="f-date" data-field="date" value="' + esc(state.dates[m.g] || '') + '"></div>') +
      '<div class="sheet-actions"><button type="button" class="btn primary wide" id="score-save" data-act="score-save"' + (filled ? '' : ' disabled') + '>' + (ro ? 'Manda il risultato nel gruppo' : 'Salva risultato') + '</button>' +
      (has2 && !ro ? '<button type="button" class="btn wide" data-act="open-mvp" data-id="' + m.id + '">' + (mvpOf(state, m).count ? 'Voti MVP' : 'Vota l\'MVP') + '</button>' : '') +
      (has2 && !ro ? '<button type="button" class="btn danger wide" data-act="score-clear">Cancella risultato</button>' : '') + '</div>';
  }

      '<div class="sheet-actions"><button type="button" class="btn primary wide" data-act="copy">Copia il testo</button>' +

      '<div class="sheet-actions"><button type="button" class="btn danger wide" data-act="reset-do">Sì, azzera tutto</button>' +

function openSheet(s) {
  var a = doc.activeElement;
  s.openerId = a && a.id ? a.id : '';
  sheet = s;
  $('sheet-root').innerHTML = '<div class="sheet-wrap" data-act="backdrop"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title" tabindex="-1">' + sheetHtml() + '</div></div>';
  doc.body.classList.add('has-sheet');
  try { $('sheet').focus({ preventScroll: true }); } catch (e) {}
  saveUi();
}

function closeSheet() {
  if (!sheet) return;
  var id = sheet.openerId;
  sheet = null;
  $('sheet-root').innerHTML = '';
  doc.body.classList.remove('has-sheet');
  saveUi();
  if (viewStale && isQuiet() && !edit) renderView();
  if (id && $(id)) { try { $(id).focus({ preventScroll: true }); } catch (e) {} }
}

function refreshScore(skipInput) {
  [0, 1].forEach(function (side) {
    var v = sheet.vals[side], input = $('score-' + side);
    if (input && input !== skipInput) input.value = v === null ? '' : v;
    var btns = doc.querySelectorAll('#sheet [data-act="score-set"][data-side="' + side + '"]');
    for (var k = 0; k < btns.length; k++) btns[k].setAttribute('aria-pressed', String(Number(btns[k].getAttribute('data-n')) === v));
  });
  var save = $('score-save');
  if (save) save.disabled = sheet.vals[0] === null || sheet.vals[1] === null;
  saveUi();
}

function openShare(text) { openSheet({ type: 'share', text: text }); }

function copyShare() {
  var ta = $('share-text'), text = sheet ? sheet.text : '';
  function fallback() {
    var ok = false;
    try { ta.focus(); ta.select(); ok = doc.execCommand('copy'); } catch (e) {}
    toast(ok ? 'Testo copiato' : 'Copia non riuscita: tieni premuto sul testo e copialo a mano.');
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('Testo copiato'); }, fallback);
      return;
    }
  } catch (e) {}
  fallback();
}

function saveScore() {
  if (!sheet || sheet.type !== 'score' || sheet.vals[0] === null || sheet.vals[1] === null) return;
  var m = sheet.m, vals = [sheet.vals[0], sheet.vals[1]];
  if (relay()) { closeSheet(); openShare(resultText(m, vals)); return; }
  if (!ready()) return;
  put('results/' + m.id, 'set', { a: vals[0], b: vals[1], at: stamp() });
  closeSheet();
  if (mvpOf(state, m).count < 4) openMvp(m, vals); else toast('Risultato inserito');
}

var ACTIONS = {
  tab: function (t, ev) { ev.preventDefault(); setTab(t.getAttribute('data-tab')); },
  guest: function () { guest = true; sSet(SS, K_GUEST, 1); ui.tab = 'classifica'; go(); },
  'to-login': function () { ui.tab = 'io'; go(); },
  logout: function () { logout(); },
  filter: function (t) { ui.filter = t.getAttribute('data-f'); saveUi(); renderView(); },
  'open-player': function (t) { openSheet({ type: 'player', i: Number(t.getAttribute('data-i')) }); },
  'edit-profile': function (t) {
    var i = Number(t.getAttribute('data-i'));
    if (i !== me && !canEdit()) return;
    openEdit(i, false);
  },
  'edit-cancel': function () {
    if (edit && edit.first) ui.tab = 'io';
    edit = null; photo.src = null;
    saveUi(); render(); scrollTop();
  },
  'edit-save': function () { saveEdit(); },
  'e-pick': function (t) {
    var k = t.getAttribute('data-k'), v = t.getAttribute('data-v');
    edit.f[k] = v;
    var all = doc.querySelectorAll('#view [data-act="e-pick"][data-k="' + k + '"]');
    for (var j = 0; j < all.length; j++) all[j].setAttribute('aria-pressed', String(all[j] === t));
    if (k === 'shot') {
      $('e-other-wrap').hidden = v !== 'altro';
      if (v === 'altro') { try { $('e-other').focus(); } catch (e) {} }
    }
    stashSoon();
  },
  'photo-clear': function () { photo.src = null; edit.f.avatar = ''; stashSoon(); renderView(); },
  'push-mine': function () {
    if (!mine || me === null) return;
    var p = mine.profile, a = mine.avatar, i = me;
    if (!ready()) return;
    put('profiles/p' + i, 'set', { profile: p, avatar: a, at: stamp() }).then(function (ok) { if (ok) toast('Scheda inviata a tutti'); });
  },
  'edit-match': function (t) {
    var id = t.getAttribute('data-id'), m = findMatch(id);
    if (!m) return;
    var r = state.results[id];
    openSheet({ type: 'score', m: m, vals: r ? [r[0], r[1]] : [null, null] });
  },
  'score-set': function (t) {
    sheet.vals[Number(t.getAttribute('data-side'))] = Number(t.getAttribute('data-n'));
    refreshScore();
  },
  'score-step': function (t) {
    var side = Number(t.getAttribute('data-side')), v = sheet.vals[side];
    sheet.vals[side] = Math.min(99, Math.max(0, (v === null ? 0 : v) + Number(t.getAttribute('data-d'))));
    refreshScore();
  },
  'score-save': function () { saveScore(); },
  'open-mvp': function (t) {
    var m = findMatch(t.getAttribute('data-id'));
    if (!m || !state.results[m.id]) return;
    if (sheet) closeSheet();
    openMvp(m);
  },
  'mvp-pick': function (t) {
    var voter = Number(t.getAttribute('data-voter')), p = Number(t.getAttribute('data-p')), m = sheet.m;
    if (matchPlayers(m).indexOf(voter) < 0 || matchPlayers(m).indexOf(p) < 0 || voter === p) return;
    var next = mvpVals()[voter] === p ? null : p;
    if (relay()) {
      if (voter !== me) return;
      sheet.touched[voter] = next;
      refreshSheet();
      return;
    }
    if (!ready()) return;
    sheet.touched[voter] = next;
    refreshSheet();
    put('votes/' + m.id + '-' + voter, next === null ? 'delete' : 'set', next === null ? undefined : { p: next, at: stamp() }).then(function () {
      // il voto ora arriva dall'archivio (oppure non è passato e torna com'era)
      if (sheet && sheet.type === 'mvp' && sheet.m === m && sheet.touched[voter] === next) { delete sheet.touched[voter]; refreshSheet(); }
    });
  },
  'mvp-relay': function () {
    var m = sheet.m, pick = sheet.touched[me];
    if (me === null || pick === null || pick === undefined) return;
    closeSheet();
    openShare(voteText(m, me, pick));
  },
  'score-clear': function () {
    if (!ready()) return;
    var m = sheet.m, votes = live.cols.votes || {};
    put('results/' + m.id, 'delete');
    matchPlayers(m).forEach(function (p) { if (has(votes, m.id + '-' + p)) put('votes/' + m.id + '-' + p, 'delete'); });
    closeSheet();
    toast('Risultato cancellato');
  },
  'close-sheet': function () { closeSheet(); },
  backdrop: function (t, ev) { if (ev.target === t) closeSheet(); },
  'share-table': function () { openShare(tableText(state, schedule)); },
  'share-day': function () {
    var nd = nextDay(state, schedule);
    if (nd >= 0) openShare(dayText(state, schedule[nd]));
  },
  copy: function () { copyShare(); },
  preset: function (t) {
    var p = PRESETS[t.getAttribute('data-p')];
    if (p) leaguePut({ rules: clone(p) });
  },
  rule: function (t) {
    var key = t.getAttribute('data-key'), d = Number(t.getAttribute('data-d')), r = clone(state.rules);
    if (!has(r, key)) return;
    r[key] = key === 'game' ? clampInt(r[key] + d, 0, 5, 0) : clampInt(r[key] + d, -9, 20, 0);
    leaguePut({ rules: r });
  },
  'ex-step': function (t) {
    ui.ex.pts = Math.min(20, Math.max(-20, ui.ex.pts + Number(t.getAttribute('data-d'))));
    $('f-ex-pts').textContent = fmtSigned(ui.ex.pts);
    $('ex-add').disabled = ui.ex.pts === 0;
  },
  'extra-add': function () {
    if (!ui.ex.pts) return;
    if (!ready()) return;
    var id = 'x' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
    var e = { p: ui.ex.p, pts: ui.ex.pts, note: cleanText(ui.ex.note, 40), at: stamp() };
    ui.ex.note = '';
    put('extras/' + id, 'set', e).then(function (ok) { if (ok) toast('Aggiunto alla classifica'); });
  },
  'extra-del': function (t) {
    var id = t.getAttribute('data-id');
    if (!/^[A-Za-z0-9_-]{1,40}$/.test(id) || !ready()) return;
    put('extras/' + id, 'delete');
  },
  'reset-ask': function () { openSheet({ type: 'reset' }); },
  'reset-do': function () {
    if (!ready()) return;
    var paths = [];
    ['results', 'votes', 'dates', 'extras'].forEach(function (c) {
      Object.keys(live.cols[c] || {}).forEach(function (id) { paths.push(c + '/' + id); });
    });
    closeSheet();
    if (!paths.length) { toast('Non c\'è niente da azzerare'); return; }
    toast('Azzero il campionato…');
    var failed = false, lanes = [];
    for (var k = 0; k < 4; k++) {
      lanes.push(paths.filter(function (_, j) { return j % 4 === k; }).reduce(function (pr, path) {
        return pr.then(function () { return failed ? false : put(path, 'delete').then(function (ok) { if (!ok) failed = true; }); });
      }, Promise.resolve()));
    }
    Promise.all(lanes).then(function () { toast(failed ? 'Azzeramento interrotto: riprova.' : 'Campionato azzerato'); });
  },
  'copy-refresh': function () { refreshCopy(); }
};

doc.addEventListener('click', function (ev) {
  var t = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!t || t.disabled) return;
  var fn = ACTIONS[t.getAttribute('data-act')];
  if (fn) fn(t, ev);
});

doc.addEventListener('submit', function (ev) {
  var f = ev.target;
  if (!f || f.id !== 'login-form') return;
  ev.preventDefault();
  var w = $('f-word').value, i = findPlayer(state, w);
  if (i < 0) {
    var e = $('login-err');
    e.hidden = false;
    e.textContent = normName(w) ? 'Parola d\'ordine non riconosciuta. È il tuo nome, scritto come in classifica.' : 'Scrivi la tua parola d\'ordine.';
    return;
  }
  login(i);
});

doc.addEventListener('input', function (ev) {
  var t = ev.target, f = t && t.getAttribute ? t.getAttribute('data-field') : '', ef = t && t.getAttribute ? t.getAttribute('data-ef') : '';
  if (f === 'score' && sheet && sheet.type === 'score') {
    var digits = t.value.replace(/\D/g, '').slice(0, 2);
    if (digits !== t.value) t.value = digits;
    sheet.vals[Number(t.getAttribute('data-side'))] = digits === '' ? null : Number(digits);
    refreshScore(t);
  } else if (f === 'ex-note') {
    ui.ex.note = t.value;
  } else if (ef && edit) {
    if (ef === 'name') edit.f.name = t.value;
    else if (ef === 'other') edit.f.other = t.value;
    else if (ef === 'motto') edit.f.motto = t.value;
    else if (ef === 'skill') {
      var k = Number(t.getAttribute('data-k'));
      edit.f.skills[k] = clampInt(t.value, 1, 10, 6);
      $('e-sk' + k + '-o').textContent = edit.f.skills[k];
    } else if (ef === 'zoom') { photo.zoom = Math.min(4, Math.max(1, Number(t.value) / 100)); paintStage(true); paintSoon(); }
    else if (ef === 'bulge') { edit.f.bulge = clampInt(t.value, 0, 100, 55); paintSoon(40); }
    else if (ef === 'toon') { edit.f.toon = clampInt(t.value, 0, 100, 70); paintSoon(40); }
    stashSoon();
  }
});

doc.addEventListener('change', function (ev) {
  var t = ev.target, f = t && t.getAttribute ? t.getAttribute('data-field') : '', ef = t && t.getAttribute ? t.getAttribute('data-ef') : '';
  if (ef === 'photo' && edit) {
    loadPhoto(t.files && t.files[0]);
    try { t.value = ''; } catch (e) {}
  } else if (f === 'name') {
    var v = cleanText(t.value, 32);
    if (!v || v === state.name) { t.value = state.name; return; }
    leaguePut({ name: v });
  } else if (f === 'player') {
    var i = Number(t.getAttribute('data-i')), name = cleanText(t.value, 14), clash = name ? findPlayer(state, name) : -1;
    if (!name || name === state.players[i]) { t.value = state.players[i]; return; }
    if (clash >= 0 && clash !== i) { t.value = state.players[i]; toast('C\'è già un giocatore con questo nome.'); return; }
    var pl = {}; pl['p' + i] = name;
    leaguePut({ players: pl });
  } else if (f === 'date' && sheet && sheet.type === 'score') {
    var g = sheet.m.g, val = /^\d{4}-\d{2}-\d{2}$/.test(t.value) ? t.value : '';
    if (!ready()) { t.value = state.dates[g] || ''; return; }
    put('dates/g' + g, val ? 'set' : 'delete', val ? { d: val } : undefined);
  } else if (f === 'ex-p') {
    ui.ex.p = Number(t.value);
  }
});

doc.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape' && sheet) { closeSheet(); return; }
